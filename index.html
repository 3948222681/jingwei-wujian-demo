<script>
const titles=["便把娇娥作儿郎","少年情结义安达","天赐神迹降宝驹","献女不成埋祸种","引外族草原祸起","四海定君臣间隙","国破家亡不自知","浴火涅槃讨血仇","前尘雨打风吹去","良心未泯仇与苦","结新友步步为营","赠字无心种因果","因差错二女品扇","解异梦凶相初显","只道当时已惘然","舐犊情深暗谋划","愿者独坐钓鱼台","龙门开故友重逢","沧海桑田断肠人","蟾宫折桂马由缰","探花街前巧失仪","双喜临二女下嫁","结连理各怀心思","曲意逢迎暗布局","三朝回门验落红","姻缘措四角奇局","温柔软刀最诛心","别有幽愁暗恨生","初闻不知曲中意","恍然已是曲中人"];
// 每章均为独立改编叙事，不复制原著段落。第20—25章尚缺用户提供的正文，采用克制的章节过场，不虚构具体情节。
const chapters=[
{time:"草原旧岁",place:"撑犁部王帐",lines:[["旁白","北境草原辽阔无垠，风从远山吹来，掠过连绵的帐篷。王帐内外，却因一场生产而屏息以待。"],["巫医","禀汗王，可敦平安诞下一位小王子。"],["苏赫巴鲁","好！传令下去，今日王帐同庆。"],["旁白","只有少数人知道襁褓中的孩子并非男儿。苏赫巴鲁命巫医为孩子刺下狼王图腾，又以山岳之名为她命名：乞颜阿古拉。"],["旁白","这个秘密将成为她一生的枷锁，也成为她与故土之间最深的一道印记。"]],prompt:"若要守住这个秘密，你会先记住什么？",opts:["记住父母的嘱托","记住自己的来处","记住眼前每个人的神情"],replies:["你将那句嘱托牢牢记在心底。","山岳不会忘记自己的根。","你把众人的神情收进记忆，等待有朝一日看懂其中深意。"],cast:["苏赫巴鲁","芙蓉","乞颜阿古拉"],rel:"苏赫巴鲁与芙蓉共同守护阿古拉的身世秘密。"},
{time:"阿古拉三至五岁",place:"撑犁部草场",lines:[["旁白","数年光阴过去，阿古拉渐渐长大。她能拉开小弓，也能在父亲的黑风背上稳稳坐住。"],["芙蓉","她还小，别总带她去草场。"],["苏赫巴鲁","乞颜家的孩子，无论男女，都该学会骑马。"],["旁白","又过两年，阿古拉与巴音结为安达。小蝶总跟在哥哥身边，巴音也成了阿古拉少有的亲近之人。"],["巴音","等我们长大了，再一起去猎黄鹿！"],["阿古拉","好。到时候把最好的鹿皮送你。"]],prompt:"面对新结识的安达，你会怎样回应？",opts:["以信物立下约定","把心里的秘密告诉他","先用行动证明情谊"],replies:["狼牙与牛角号，成为两人珍重的信物。","你终究没有说出那个不能说的秘密。","你们并肩走向草场，情谊在日常中慢慢扎根。"],cast:["巴音","小蝶","阿古拉"],rel:"阿古拉与巴音结为安达；阿古拉疼爱妹妹小蝶。"},
{time:"阿古拉五至八岁",place:"汗王营地·马厩",lines:[["旁白","一匹汗血宝马被带回营地，烈性难驯，数名勇士已被它所伤。苏赫巴鲁想到了阿古拉。"],["苏赫巴鲁","若觉得危险，便立刻退开。"],["阿古拉","父汗，先把弓放下。它不是想伤人，只是害怕。"],["旁白","阿古拉卸下弯刀与马鞭，慢慢走近。她似乎听见了马儿的心声，终于让那匹烈马安静下来。"],["阿古拉","它有了身孕。等小马驹长大，我想把它送给小蝶。"],["旁白","几年后，阿古拉与巴音因猎狼之事遭哈尔巴拉刁难。小蝶拾起石头，从后方砸向欺辱哥哥的人。"]],prompt:"当亲近的人为你挺身而出，你会？",opts:["先确认她有没有受伤","压下怒火，避免事态扩大","记住这份保护，日后偿还"],replies:["你先查看小蝶的手，确认她没有受伤。","你不愿让冲突牵连更多人。","这份情意，你会一直记得。"],cast:["哈尔巴拉","汗血马","小蝶"],rel:"阿古拉与小蝶彼此守护；汗血马认阿古拉为主。"},
{time:"草原盛典前后",place:"撑犁部王帐",lines:[["旁白","阿古拉将狼牙项链送给巴音，巴音则回赠亲手刻字的牛角号。两个少年把秘密与约定藏进信物里。"],["旁白","与此同时，南渭国的南宫让整顿朝政，设立新的官制。于子期献上《九州环宇》，让他第一次清晰看见北方草原的辽阔与富庶。"],["额日和","愿将小女吉雅留在撑犁部，待她长成，许配给阿古拉。"],["苏赫巴鲁","吉雅是我的妹妹，论辈分不合。此事不必再议。"],["旁白","额日和愤然离席。酒碗碎裂的声音落下时，一道裂痕也悄然留在两部之间。"]],prompt:"面对带着利益而来的联姻提议，你会？",opts:["先辨明对方真正所求","守住原则，拒绝交换","暂缓表态，留意后续动向"],replies:["你听出了礼物背后的条件。","有些底线不能用牛羊与土地衡量。","你没有立刻答应，也没有放松警惕。"],cast:["额日和","南宫让","苏赫巴鲁"],rel:"苏赫巴鲁拒绝额日和的联姻与草场要求，图巴部积怨。"},
{time:"冬季·草原战乱",place:"阿卡部与撑犁部边境",lines:[["旁白","冬日传来阿卡部遭屠戮的消息，伤口与箭矢都指向南方。苏赫巴鲁查出图巴部与渭国暗中勾连。"],["苏赫巴鲁","额日和引外敌入草原，不能再坐视。"],["旁白","渭国大军趁冰渡境，凭借武器与人数优势击溃草原联军。古奇为救苏赫巴鲁而死，临终只留下两个字。"],["古奇","安达……跑！"],["旁白","苏赫巴鲁决定分散转移妇孺与孩童，自己留下拖住追兵。阿古拉与小蝶不愿离开，父亲却告诉她们：活下去，才有草原的以后。"],["巴音","我要回去，为我父亲报仇！"],["旁白","巴音与阿古拉分别。狼牙项链与刻字牛角号仍在彼此身边，像两个人未能说完的誓言。"]],prompt:"在生离死别面前，你最想留下什么？",opts:["一句承诺","一件信物","一个能活下去的理由"],replies:["你把没来得及说完的话留给未来。","信物贴着心口，提醒你们曾并肩而行。","只要还有人活着，故事就没有结束。"],cast:["古奇","布沁","巴音"],rel:"古奇牺牲；巴音与阿古拉分别；阿古拉带着牛角号。"},
{time:"流亡半年余",place:"洛水绝壁",lines:[["旁白","阿古拉与小蝶随队逃亡，粮食渐尽。她不肯杀马充饥，仍记得草原人如何看待马匹。"],["旁白","追兵逼近，忠勇之士布沁拼死护送。兄妹最终被迫分开，阿古拉骑着流火向南突围。"],["丁仪","那匹马不寻常！继续追，不能让它跑了！"],["旁白","流火已筋疲力尽。绝壁之前，阿古拉摸着怀中的牛角号，向父母、小蝶与安达告别。流火载着她纵身跃下。"],["旁白","另一边，陆权带额日和入京。南宫让表面封赏，心中却已忌惮陆权权势。君臣之间，裂隙初生。"]],prompt:"当退路已尽，你会如何面对最后一刻？",opts:["守住伙伴，不独自逃生","相信仍有生路","把最重要的人记在心里"],replies:["你没有放弃流火。","绝境之中，你仍然选择相信。","那些名字，是你不肯熄灭的灯火。"],cast:["阿古拉","流火","陆权","南宫让"],rel:"阿古拉与流火坠崖；南宫让开始忌惮陆权。"},
{time:"获救后·大半年",place:"面具人居所",lines:[["旁白","阿古拉被面具人救起。醒来后，她第一句话便是询问流火。得知爱马已死，她悲痛得再次昏厥。"],["丁酉","她醒来后一直问，什么时候能回家。"],["旁白","面具人最终答应送她回草原。可当她踏上故土，眼前只剩被改作牲口棚的王帐旧址。"],["武大","图巴部额日和勾结渭国，撑犁王族……已遭屠戮。"],["旁白","阿古拉再度倒下。醒来后，她主动找到面具人，提出要复仇。"],["面具人","你要报的不是一家之仇，是亡国灭种之仇。忍得住，等得起。"]],prompt:"当复仇成为唯一支柱，你会？",opts:["请求师父教自己忍耐","立刻寻找报仇的机会","先弄清敌人的根基"],replies:["你向面具人行了草原大礼。","你被告知，冲动只会让仇人更容易脱身。","复仇不是一刀之事，而是一场漫长的棋局。"],cast:["面具人","丁酉","武大"],rel:"阿古拉拜面具人为师，立下复仇目标。"},
{time:"景嘉元年冬",place:"无名谷",lines:[["旁白","十岁的阿古拉正式拜师。她开始学习渭国文字、礼仪与典章，日复一日苦读至深夜。"],["面具人","三年之后，我再看你的资质。先学会如何做一个渭国人。"],["旁白","面具人曾计划刺杀南宫让，却在封禅前改变主意。他不满足于只取一人性命，要的是让伪朝从内部崩裂。"],["旁白","雷雨之夜，阿古拉被迫一遍遍回忆草原覆灭。她把痛苦压进心底，渐渐学会在仇恨面前不露声色。"]],prompt:"漫长训练中，什么最能支撑你？",opts:["故土的记忆","对仇人的恨","不让牺牲白费的决心"],replies:["草原的风声一直留在你心里。","仇恨给你力量，也提醒你不要被它吞没。","你把每一次坚持都当作对逝者的回应。"],cast:["面具人","阿古拉"],rel:"阿古拉在无名谷接受训练，逐渐融入渭国文化。"},
{time:"景嘉四年",place:"允州",lines:[["旁白","十四岁的阿古拉已能熟练使用渭国礼法。师父交给她新的身份卷宗：齐颜，十四岁，晋州白鹿郡白水村人。"],["齐颜","从今日起，世上再无乞颜阿古拉。"],["旁白","丁酉担忧药物副作用，劝她给自己留一条退路。齐颜却没有回头。临别时，丁酉留下药方与药丸，盼她少受梦魇折磨。"],["旁白","齐颜抵达允州，租下小院。集市上，她认出欺辱卖身葬父少女的丁奉山，杀意翻涌，却强迫自己忍住。"]],prompt:"当仇人近在眼前，你会？",opts:["现在动手","记下此人，等待时机","先救眼前无辜之人"],replies:["你知道此刻暴露身份只会毁掉多年筹谋。","你压住杀意，把名字记进心底。","你最终还是没有放任那名少女孤立无援。"],cast:["齐颜","丁酉","丁奉山"],rel:"齐颜启用假身份；丁酉与齐颜分别。"},
{time:"四月初三",place:"允州·齐颜小院",lines:[["旁白","雷雨唤醒齐颜最深的创伤。她在雨中奔走，直到看见卖身葬父的少女，才想起自己尚未面对的良知。"],["齐颜","先把老人安葬了。这些银子你拿着。"],["少女","我愿意卖身报恩。"],["齐颜","不必。我不需要人伺候。"],["旁白","她告诉自己，这是最后一次怜悯渭国人，权当替母亲偿还旧日恩情。次日，齐颜走进童生院。"]],prompt:"当善意与复仇的信念相撞，你会？",opts:["承认自己仍有恻隐之心","把这次帮助当作偿还","不再追问自己的动机"],replies:["你没有办法让自己彻底变得冷硬。","你用一个理由安放这份善意。","你暂时把复杂心绪压回心底。"],cast:["齐颜","卖身少女"],rel:"齐颜救助卖身葬父的少女，准备参加童生试。"},
{time:"童生试",place:"允州考院",lines:[["旁白","考院搜身，丁奉山因家世受到特殊对待。齐颜与公羊槐照章受检。她确认伪装无虞，便安静入场。"],["旁白","试题看似平常，齐颜却看出其中为丁奉山留下的方便。她刻意收敛锋芒，文章中规中矩，字迹却难掩功底。"],["公羊槐","齐兄文章不俗，日后若有机会，愿与你再论经义。"],["齐颜","公羊兄抬爱。来日方长。"],["旁白","两人在醉白楼相谈。齐颜不饮酒，只饮茶；她借着谈话，悄然将公羊槐引向丁家舞弊的疑点。"]],prompt:"结交一位可能有用的朋友，你会？",opts:["先以诚意相待","谨慎观察对方立场","借共同话题建立联系"],replies:["你以礼相待，却没有交出全部真心。","你留意他的言谈与家世。","一场关于文章与时局的交谈就此开始。"],cast:["公羊槐","丁奉山","齐颜"],rel:"齐颜与公羊槐结识；齐颜暗中推动丁家舞弊线索浮现。"},
{time:"童生试放榜后",place:"允州府学",lines:[["旁白","十五日后红榜张贴，齐颜名列榜首，公羊槐次之，丁奉山第三。齐颜取得府学文书，离开允州继续历练。"],["旁白","三年后，京中局势渐变。陆伯言在秋闱中拔得解元，陆权开始考虑交出兵权。"],["旁白","齐颜以冀州府解元身份入京，却在公羊府门前扑了空。公羊槐赴宴未归，门房的怠慢让她没有留下。"],["旁白","公羊槐遗失的折扇被南宫姝女拾得。扇面上的字句，悄然牵动了她的心。"]],prompt:"多年后再见旧友，你会先说什么？",opts:["解释当年的误会","先问对方近况","把未说出口的情谊留在眼神里"],replies:["有些误会并非不能解释，只是需要时机。","你先关心他这些年的经历。","你没有急着说破，只让重逢自然发生。"],cast:["公羊槐","陆伯言","南宫姝女"],rel:"齐颜与公羊槐错过一次重逢；南宫姝女拾得题字折扇。"},
{time:"京城·春闱前",place:"京城书斋",lines:[["旁白","南宫姝女珍藏折扇，南宫静女只觉得扇面字迹清雅。公羊槐发现折扇遗失，想寻齐颜，却被父亲禁足。"],["旁白","齐颜囊中羞涩，前往书斋求取抄书之事。掌柜赏识她的魏碑字，愿意收稿，也愿代为售字。"],["旁白","深夜，南宫让梦见异兽踏云而来。观天司执事郭青琉解梦，称或有奇才将为皇帝所用。"],["南宫让","奇才？朕倒要看看，这天下会送来什么人。"]],prompt:"面对一份意外的赏识，你会？",opts:["接受机会但不露锋芒","拒绝以免引人注目","先观察对方是否可信"],replies:["你接受了工作，却保留自己的节奏。","你不愿轻易把才华交到陌生人手中。","你没有立即答应，先看清对方的用意。"],cast:["南宫让","郭青琉","公羊槐"],rel:"南宫让得到异梦解读；齐颜开始以牧羊居士名义售字。"},
{time:"午夜·异梦",place:"皇宫·寝殿",lines:[["旁白","南宫让梦见异兽踏着玄黑云彩而来，雷声滚滚。异兽闯入寝宫，令他惊醒。"],["南宫让","传观天司执事郭青琉。朕要知道这梦究竟意味着什么。"],["郭青琉","此兽并非麒麟金龙，却似有非凡之力。黑云雷霆或为助力，恐有奇才将为陛下所用。"],["旁白","南宫让想起殿试将近，又收到陆权与陆仲行相关密报。梦境带来的不安，并未因此消散。"]],prompt:"面对无法解释的征兆，你会？",opts:["相信征兆","查清现实中的线索","暂且按下不表"],replies:["你愿意相信命运有所暗示。","你更愿意从人事与权力关系中寻找答案。","你决定等待更多迹象。"],cast:["南宫让","郭青琉","陆仲行"],rel:"南宫让开始怀疑陆仲行与蓁蓁公主的关系，也期待奇才出现。"},
{time:"春闱前夕",place:"京城",lines:[["旁白","齐颜将抄书交回书斋，掌柜对她的字赞不绝口。她以‘牧羊居士’为名留下词作与碑帖。"],["旁白","武大带来春闱主考官的消息，提醒她不要忘记初衷。齐颜追问时，意外撞上乔装出府的南宫姝女与南宫静女。"],["南宫静女","走路不长眼么？"],["齐颜","是在下失礼。殿下可要去医馆？"],["旁白","齐颜没有认出两位公主。她只在南宫静女的责问中，想起早已失去的小蝶。"]],prompt:"与陌生人意外冲突，你会？",opts:["先道歉，再确认对方安好","不争辩，尽快离开","记住对方的反应"],replies:["你选择先把眼前的事处理妥当。","你不愿在京城街头惹出更多麻烦。","你留意到那位少女与众不同的脾性。"],cast:["南宫姝女","南宫静女","武大"],rel:"齐颜初遇南宫姐妹；南宫静女对齐颜留下印象。"},
{time:"春闱前",place:"京城·齐颜寓所",lines:[["旁白","齐颜回想草原遗民在渭国受辱的处境，曾将盘缠拿去帮助她们。她知道自己无法拯救所有人，却仍记得每一张面孔。"],["旁白","她分析春闱考官的立场，判断谁清正、谁与陆权有所牵连。谢安的请帖送到时，她没有贸然推拒。"],["旁白","南宫让得知女儿乔装出宫，表面宽容，暗中却对陆仲行与陆家生出新的猜测。"],["旁白","齐颜的字画卖出高价，牧羊居士的名声渐渐传开。"]],prompt:"面对逐渐靠近的权力中心，你会？",opts:["借势而行","先把自己藏好","让对方以为自己有所求"],replies:["你知道棋局需要落子，也需要借势。","你仍把谨慎放在第一位。","你开始布置一个看似自然的入口。"],cast:["谢安","南宫让","陆仲行"],rel:"齐颜与谢安的联系逐渐建立；南宫让开始留意陆家。"},
{time:"春闱前夕",place:"谢府",lines:[["旁白","武大回无名谷复命。面具人看出齐颜售字并非贪财，而是在为自己留下可供追查的来历。"],["旁白","齐颜赴谢府宴会，见到各地寒门学子，也见到了化名许望的皇三子南宫望。"],["南宫望","今日相聚，只论文章，不必拘礼。"],["齐颜","公子雅量。"],["旁白","齐颜不饮酒，以巧妙的诗句应对行酒令。她没有急于表明立场，却将南宫望记在心里。"]],prompt:"面对主动笼络人才的皇子，你会？",opts:["保持礼貌距离","适度展示才学","暂不表态，观察其野心"],replies:["你不拒绝交往，也不轻易许诺。","你让对方看到你的才华，却不交出底牌。","你把这次相见记作一枚棋子。"],cast:["南宫望","谢安","齐颜"],rel:"齐颜识得南宫望，开始考虑借助其夺嫡之心。"},
{time:"景嘉七年·三月",place:"京城·春闱考场",lines:[["旁白","谢安向寒门学子赠银，齐颜看出南宫望有意笼络人才，决定暂时闭门备考。书斋中一幅牧羊居士作品被高价拍卖，引出争端。"],["旁白","三月三春闱开考，齐颜终于与公羊槐重逢。两人解释旧日错过，情谊并未因时光而淡。"],["公羊槐","我还以为你当年留玉佩，是不愿再见我。"],["齐颜","那是证明我曾来过，也证明我没有失约。"],["旁白","会试三日，齐颜夜间视物不便。主考官邢经赋体恤她的情况，安排士兵天亮叫醒。五月初五放榜前，她为妹妹煮了两碗素面。报喜声终于传来：齐颜高中会元。"]],prompt:"多年苦读终于有了结果，此刻你最想起谁？",opts:["曾经并肩的朋友","再也见不到的家人","一路教导自己的师长"],replies:["你想起那段尚且无忧的少年时光。","一碗素面前，旧日亲人仿佛仍在身边。","那些严苛的教导，终究成为你走到今日的力量。"],cast:["公羊槐","邢经赋","齐颜"],rel:"齐颜与公羊槐重逢；齐颜高中会元。"},

function render(){let c=chapters[S.chapter],d=currentLine();$('chapterKicker').textContent='第'+(S.chapter+1)+'章';$('chapterName').textContent=titles[S.chapter];$('sceneLabel').textContent='场景 · '+c.place;$('speakerName').textContent=d.speaker;$('speakerKind').textContent=d.kind;$('dialogueText').textContent=d.text;$('hintText').textContent=S.step===c.lines.length?'请选择你的回应':S.step>=c.lines.length+1?'进入下一章':'点击继续';let choosing=S.step===c.lines.length;$('choicePrompt').classList.toggle('hidden',!choosing);$('choicePrompt').textContent=choosing?c.prompt:'';$('choiceArea').classList.toggle('hidden',!choosing);$('choiceArea').innerHTML='';if(choosing)c.opts.forEach((t,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="num">0'+(i+1)+'</span>'+esc(t);b.onclick=()=>choose(i);$('choiceArea').appendChild(b);});$('advanceArea').style.pointerEvents=choosing?'none':'auto';$('nodeNote').textContent='选择只影响当下回应，不改变原著主线。'+(c.note?' '+c.note:'');$('autoBtn').innerHTML=(S.auto?'Ⅱ':'▷')+' <span class="label">自动</span>';$('sceneBg').style.background='radial-gradient(ellipse at 18% 22%,#71857975 0%,transparent 38%),radial-gradient(ellipse at 82% 18%,#b39d7860 0%,transparent 34%),linear-gradient(135deg,#1b2924,#34443a 42%,#17231f)';save();}
function advance(){let c=chapters[S.chapter];if(S.step===c.lines.length)return;if(S.step<c.lines.length){S.history.push({chapter:S.chapter,step:S.step,...currentLine()});S.step++;render();return;}if(S.step===c.lines.length+1){S.history.push({chapter:S.chapter,step:S.step,...currentLine()});if(S.chapter<29){unlockCompleted(S.chapter+1);S.chapter++;S.step=0;render();}else{$('dialogueText').textContent='第一至三十章互动篇章暂告一段落。感谢你与人物同行。';$('hintText').textContent='已到当前篇章末尾';S.step++;save();}}}
function choose(i){let c=chapters[S.chapter];S.choices[S.chapter]=i;S.history.push({chapter:S.chapter,step:S.step,speaker:'你的选择',kind:'互动抉择',text:c.opts[i]});S.step++;playChime();render();}
function rollback(){if(S.history.length){let h=S.history.pop();S.chapter=h.chapter;S.step=h.step;render();}else if(S.step>0){S.step--;render();}else toast('已经回到本章开头');}
function unlock(id){if(S.unlocked.includes(id))return;S.unlocked.push(id);let a=achievements.find(x=>x.id===id);if(a){showToast('成就解锁 · '+a.name);playChime();}save();}
function unlockCompleted(n){achievements.forEach(a=>{if(a.at===n)unlock(a.id);});}
function showToast(t){$('toastText').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3000);}function toast(t){$('toastText').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200);}
function openPanel(which){let title='',html='';if(which==='about'){title='制作与说明';html='<p class="muted">《泾渭无间》为非官方互动同人作品。原著名称与人物归原著作者及版权方所有。本页面文字为互动改编，不是原著正文，也不替代原著阅读。第20—25章尚缺用户提供的正文，因此目前仅保留章节过场，未编造具体情节。</p>';}
if(which==='chapters'){title='章节目录';html=titles.map((t,i)=>`<div class="panel-row"><strong>第${i+1}章 · ${t}</strong><p>${chapters[i].note||chapters[i].time+' · '+chapters[i].place}</p><button class="tool" onclick="goChapter(${i})">阅读本章</button></div>`).join('');}
if(which==='history'){title='剧情回看';html=S.history.length?S.history.slice().reverse().map(h=>`<div class="panel-row"><strong>第${h.chapter+1}章 · ${esc(h.speaker)} · ${esc(h.kind)}</strong><p>${esc(h.text)}</p><button class="tool" onclick="goHistory(${h.chapter},${h.step})">回到此处</button></div>`).join(''):'<p class="muted">尚无回看记录。</p>';}
if(which==='time'){let c=chapters[S.chapter];title='故事时间';html=`<div class="panel-row"><strong>当前章节</strong><p>第${S.chapter+1}章 · ${titles[S.chapter]}</p></div><div class="panel-row"><strong>时间线索</strong><p>${esc(c.time)}</p></div><div class="panel-row"><strong>所在地点</strong><p>${esc(c.place)}</p></div><p class="muted">仅展示目前能够确认的时间与地点；未核实的具体日期、时辰不会擅自补写。</p>`;}
if(which==='characters'){title='人物资料';let names=[...new Set(chapters.slice(0,S.chapter+1).flatMap(c=>c.cast||[]))];html=names.map(n=>`<div class="panel-row"><strong>${esc(n)}</strong><p>${esc(castInfo[n]||'随剧情推进逐步解锁，暂不补写未确认资料。')}</p></div>`).join('')+'<p class="muted">人物资料按当前剧情进度解锁，避免提前剧透。</p>';}
if(which==='relations'){title='人物关系网';const people=[['齐颜',50,145],['南宫静女',245,65],['南宫姝女',245,225],['南宫让',445,65],['陆仲行',445,225],['巴音',50,305],['苏赫巴鲁',245,305],['南宫望',545,145]];const edges=[[0,1,'夫妻'],[1,2,'姐妹'],[1,3,'父女'],[2,3,'父女'],[2,4,'夫妻'],[0,5,'安达'],[5,6,'父子'],[0,7,'谋局接触']];let visible=people.filter(([n])=>n==='齐颜'||chapters.slice(0,S.chapter+1).some(c=>(c.cast||[]).includes(n)));let ids=new Set(visible.map(x=>x[0]));let pos=Object.fromEntries(people.map(([n,x,y])=>[n,[x,y]]));let lines=edges.filter(([a,b])=>ids.has(people[a][0])&&ids.has(people[b][0])).map(([a,b,label])=>{let A=people[a],B=people[b],x=(A[1]+B[1])/2,y=(A[2]+B[2])/2;return `<line x1="${A[1]+38}" y1="${A[2]+16}" x2="${B[1]+38}" y2="${B[2]+16}" stroke="#c9b98e88" stroke-width="1.5"/><text x="${x+38}" y="${y+8}" fill="#d8c69d" font-size="10" text-anchor="middle">${label}</text>`}).join('');let nodes=visible.map(([n,x,y])=>`<button class="relation-node" style="left:${x/6}% ;top:${y/3.6}%" onclick="showRelationPerson('${esc(n)}')">${esc(n)}</button>`).join('');html=`<p class="muted">点击人物节点，查看已解锁的人物资料与关系。人物随剧情逐步出现。</p><div class="relation-graph"><svg viewBox="0 0 600 360" preserveAspectRatio="none">${lines}</svg>${nodes}</div><div id="relationPerson" class="relation-detail"><strong>选择一位人物</strong><p>点击上方关系网中的人物，即可查看其身份与当前已知关系。</p></div>`;}
if(which==='achievements'){title='成就册';html=achievements.map(a=>`<div class="panel-row"><strong>${S.unlocked.includes(a.id)?'★ '+a.name:'◇ 未解锁成就'}</strong><p>${S.unlocked.includes(a.id)?a.desc:'继续阅读，探索解锁条件。'}</p></div>`).join('');}
if(which==='settings'){title='体验设置';html=`<div class="setting-row"><span>背景音乐</span><input type="checkbox" ${S.music?'checked':''} onchange="setMusic(this.checked)"></div><div class="setting-row"><span>音乐音量</span><input type="range" min="0" max="1" step=".01" value="${S.volume}" oninput="S.volume=+this.value;setVolume()"></div><div class="setting-row"><span>音效音量</span><input type="range" min="0" max="1" step=".01" value="${S.sfx}" oninput="S.sfx=+this.value;save()"></div><div class="setting-row"><span>自动播放</span><input type="checkbox" ${S.auto?'checked':''} onchange="toggleAuto(this.checked)"></div><p class="muted">背景音乐与提示音由网页 WebAudio 合成，不是原声录音。首次播放需点击页面以启用音频。</p>`;}
$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('panel').classList.add('open');}
function showRelationPerson(name){let box=$('relationPerson');if(!box)return;let info=castInfo[name]||'该人物资料会随原著剧情推进逐步补充。';let related=[];chapters.slice(0,S.chapter+1).forEach((c,i)=>{if((c.cast||[]).includes(name)&&c.rel)related.push('第'+(i+1)+'章：'+c.rel)});box.innerHTML=`<strong>${esc(name)}</strong><p>${esc(info)}</p><p>${esc(related.slice(-3).join('；')||'目前尚无更多已解锁关系记录。')}</p>`;}
function closePanel(){$('panel').classList.remove('open');}function goChapter(i){S.chapter=i;S.step=0;closePanel();render();}function goHistory(c,s){S.chapter=c;S.step=s;closePanel();render();}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveGame(){save();toast('存档已保存至本设备');}function toggleAuto(v){S.auto=typeof v==='boolean'?v:!S.auto;clearInterval(autoTimer);if(S.auto)autoTimer=setInterval(()=>{if(!$('panel').classList.contains('open'))advance();},4200);render();}
function setMusic(v){S.music=v;if(v)startMusic();else stopMusic();save();}function setVolume(){if(audio&&audio.master)audio.master.gain.value=S.volume;save();}
function initAudio(){if(audio)return;let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C(),master=ctx.createGain();master.gain.value=S.volume;master.connect(ctx.destination);audio={ctx,master};}
function startMusic(){if(!S.music)return;initAudio();if(!audio)return;audio.ctx.resume();if(musicTimer)return;let seq=[196,220,261.63,293.66,261.63,220,174.61,196],i=0;musicTimer=setInterval(()=>{if(!audio||!S.music)return;let now=audio.ctx.currentTime;[1,.5,.25].forEach((v,j)=>{let o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type=j===0?'triangle':'sine';o.frequency.value=seq[(i+j*2)%seq.length]*v;g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime((j===0?.055:.018)*S.volume,now+.15);g.gain.exponentialRampToValueAtTime(.0001,now+2.2);o.connect(g);g.connect(audio.master);o.start(now);o.stop(now+2.3);});i++;},2300);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}function playChime(){if(!S.sfx)return;initAudio();if(!audio)return;let now=audio.ctx.currentTime;[659.25,880,1046.5].forEach((f,i)=>{let o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.09);g.gain.linearRampToValueAtTime(.10*S.sfx,now+i*.09+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.55);o.connect(g);g.connect(audio.master);o.start(now+i*.09);o.stop(now+i*.09+.6);});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();else if(e.key===' '&&$('game').style.display==='block'&&!$('panel').classList.contains('open')){e.preventDefault();advance();}});
</script>
</body></html>
