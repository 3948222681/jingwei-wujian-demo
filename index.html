
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111d21">
<title>泾渭无间 · 互动故事</title>
<style>
:root{--gold:#d9bd88;--paper:#eee5d5;--muted:#b8ad9b;--panel:rgba(12,22,26,.86)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111d21;color:var(--paper);font-family:"Noto Serif SC","Songti SC",serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#app{height:100%;width:100%;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;background:linear-gradient(180deg,#82988e 0%,#405e53 48%,#172d2c 100%);transition:background 1s}
#scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,17,.05),rgba(5,13,17,.15) 35%,rgba(5,13,17,.86) 100%)}
#scene.grass{background:linear-gradient(160deg,#8da99b,#587968 48%,#263e34)}
#scene.tent{background:radial-gradient(ellipse at 50% 25%,#a1835d,#5b4938 50%,#172329)}
#scene.snow{background:linear-gradient(155deg,#b4c2c0,#718c92 48%,#263e48)}
#scene.palace{background:linear-gradient(150deg,#a08c70,#655849 50%,#253137)}
#scene.night{background:radial-gradient(ellipse at 60% 25%,#526276,#26384b 48%,#101923)}
#scene.river{background:linear-gradient(165deg,#8da9a5,#466b70 48%,#1b353d)}
#scene:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#07121688,transparent)}
.brand{font-size:16px;letter-spacing:5px;color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tool,.action{border:1px solid #d9bd8844;background:#0b191d88;border-radius:30px;padding:9px 14px;font-size:12px;backdrop-filter:blur(12px)}
.tool:hover,.action:hover{border-color:var(--gold);color:var(--gold)}
.main{position:absolute;z-index:3;inset:13% 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 6vw 6vh}
.chapter-label{color:var(--gold);font-size:12px;letter-spacing:4px;margin-bottom:12px;text-align:center}
.chapter-title{font-size:clamp(24px,4vw,38px);font-weight:400;letter-spacing:5px;margin:0 0 22px;text-align:center;text-shadow:0 2px 20px #0008}
.dialogue{width:min(940px,100%);min-height:205px;padding:24px 30px 18px;border:1px solid #d9bd8844;border-radius:17px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 18px 60px #0005;cursor:pointer}
.speaker{font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:15px}
.line{font-size:clamp(16px,2vw,20px);line-height:2;letter-spacing:1px;min-height:86px;white-space:pre-wrap}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#a99f8f;font-size:11px}
.hint{color:var(--gold);letter-spacing:2px}
.bottom{width:min(940px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.bottom-group{display:flex;gap:8px}
.action.primary{border-color:var(--gold);color:var(--gold);background:#d9bd8822}
.action:disabled{opacity:.35;cursor:not-allowed}
.progress{position:absolute;z-index:6;bottom:0;left:0;height:2px;background:var(--gold);width:0;transition:width .25s}
.overlay{display:none;position:absolute;inset:0;z-index:20;background:#071115c9;backdrop-filter:blur(15px);align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.modal{width:min(760px,100%);max-height:86%;overflow:auto;background:#17272b;border:1px solid #d9bd8855;border-radius:18px;padding:25px;box-shadow:0 20px 80px #0008}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal h2{font-size:21px;font-weight:400;letter-spacing:3px;color:var(--gold);margin:0}
.close{background:none;border:0;font-size:25px;color:var(--paper)}
.chapter-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.chapter-item{text-align:left;padding:12px;border:1px solid #d9bd8822;border-radius:11px;background:#ffffff08}
.chapter-item:hover,.chapter-item.current{border-color:var(--gold);background:#d9bd8818}
.chapter-item small{display:block;color:#aa9e89;margin-bottom:5px}
.chapter-item strong{font-size:14px;font-weight:400}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #ffffff18}
.setting-row label{font-size:14px;color:#d8cfbd}
.setting-row input{width:45%;accent-color:var(--gold)}
.setting-row select{background:#17272b;color:var(--paper);border:1px solid #746b58;padding:8px;border-radius:8px}
.note{font-size:12px;line-height:1.9;color:#a99f8f}
#titleScreen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(#07121622,#071216d9)}
.title-content{max-width:650px}
.title-small{letter-spacing:8px;color:var(--gold);font-size:12px}
.title-name{font-size:clamp(42px,8vw,76px);font-weight:400;letter-spacing:12px;margin:25px 0}
.title-sub{color:#d2c8b6;letter-spacing:4px;font-size:13px}
.title-desc{color:#c0b8a9;line-height:2.2;margin:30px auto;max-width:480px;font-size:14px}
.start{padding:13px 42px;border:1px solid var(--gold);border-radius:40px;background:#d9bd8818;color:var(--gold);letter-spacing:5px}
.start:hover{background:#d9bd8838}
.view-choice{margin-top:20px;color:#c8bdab;font-size:13px}
.view-choice button{background:none;border:0;color:var(--gold);padding:8px 12px}
#toast{position:absolute;z-index:40;bottom:25px;left:50%;transform:translateX(-50%);background:#17272b;padding:10px 18px;border-radius:20px;color:var(--gold);font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
@media(max-width:600px){
 .top{padding:13px 13px;align-items:flex-start}
 .brand{font-size:13px;letter-spacing:3px;margin-top:8px}
 .tool{padding:7px 9px;font-size:11px}
 .main{inset:12% 0 0;padding:12px 13px 4vh}
 .chapter-title{letter-spacing:3px;margin-bottom:14px}
 .dialogue{padding:19px 17px 14px;min-height:205px;border-radius:14px}
 .line{font-size:16px;line-height:1.95}
 .bottom{margin-top:11px}
 .action{padding:9px 11px;font-size:12px}
 .bottom-group{gap:5px}
 .chapter-list{grid-template-columns:1fr}
 .modal{padding:19px}
 .title-name{letter-spacing:7px}
}
</style>
</head>
<body>
<div id="app">
<div id="scene" class="grass"></div>

<div id="titleScreen">
 <div class="title-content">
  <div class="title-small">INTERACTIVE STORY</div>
  <h1 class="title-name">泾渭无间</h1>
  <div class="title-sub">北泾 · 南渭 · 山河旧梦</div>
  <p class="title-desc">一段始于草原的故事。<br>从一个被称作王子的孩子开始，<br>走过故国、山河与漫长岁月。</p>
  <button class="start" onclick="startGame()">开启故事</button>
  <div class="view-choice">叙事视角：
   <button onclick="chooseView('齐颜')">齐颜</button>
   <button onclick="chooseView('南宫静女')">南宫静女</button>
  </div>
  <p class="note">改编自《泾渭情殇》· 请君莫笑原著<br>非官方个人同人互动作品</p>
 </div>
</div>

<header class="top">
 <div class="brand">泾渭无间</div>
 <div class="tools">
  <button class="tool" onclick="openChapters()">章节</button>
  <button class="tool" onclick="openSettings()">设置</button>
  <button class="tool" onclick="saveGame()">存档</button>
  <button class="tool" onclick="loadGame()">读档</button>
 </div>
</header>

<main class="main">
 <div class="chapter-label" id="chapterLabel">第一章 · 上部</div>
 <h2 class="chapter-title" id="chapterTitle">便把娇娥作儿郎</h2>
 <section class="dialogue" onclick="advance()">
  <div class="speaker" id="speaker">旁白</div>
  <div class="line" id="line">故事即将开始。</div>
  <div class="foot"><span id="counter">点击继续</span><span class="hint">点击继续 ›</span></div>
 </section>
 <div class="bottom">
  <div class="bottom-group">
   <button class="action" onclick="previousLine()">回看</button>
   <button class="action" id="autoBtn" onclick="toggleAuto()">自动</button>
  </div>
  <div class="bottom-group">
   <button class="action" onclick="toggleMute()">音乐</button>
   <button class="action primary" onclick="advance()">继续 ›</button>
  </div>
 </div>
</main>
<div class="progress" id="progress"></div>

<div class="overlay" id="chapterOverlay">
 <div class="modal">
  <div class="modal-head"><h2>章节目录</h2><button class="close" onclick="closeOverlay('chapterOverlay')">×</button></div>
  <div class="chapter-list" id="chapterList"></div>
 </div>
</div>

<div class="overlay" id="settingsOverlay">
 <div class="modal">
  <div class="modal-head"><h2>故事设置</h2><button class="close" onclick="closeOverlay('settingsOverlay')">×</button></div>
  <div class="setting-row"><label for="musicVolume">背景音乐音量</label><input id="musicVolume" type="range" min="0" max="100" value="20" oninput="setVolume(this.value)"></div>
  <div class="setting-row"><label for="textSpeed">文字速度</label><input id="textSpeed" type="range" min="10" max="90" value="35" oninput="setTextSpeed(this.value)"></div>
  <div class="setting-row"><label for="viewSelect">叙事视角</label><select id="viewSelect" onchange="changeView(this.value)"><option value="齐颜">齐颜</option><option value="南宫静女">南宫静女</option></select></div>
  <div class="setting-row"><label>自动播放</label><button class="action" onclick="toggleAuto()">开启 / 关闭</button></div>
  <p class="note">当前背景为无人物的氛围色彩占位，后续可逐章替换为对应地点的真实风景摄影。音乐为原创合成氛围音演示，可关闭或调节音量。</p>
 </div>
</div>
<div id="toast"></div>
</div>

<script>
const chapters = [
{title:"便把娇娥作儿郎",theme:"grass",lines:[
["旁白","白云悠悠，绿草如茵。风吹过草原，碧色的草浪一路延伸到天边。"],
["旁白","一支队伍正从远处疾驰而来。领头的大汗接到消息：可敦要生产了。"],
["旁白","他顾不得休息，催马赶回王帐。"],
["旁白","帐中传来婴儿嘹亮的啼哭。大汗终于赶到床边，望向刚刚生产的可敦。"],
["大汗","妹子，你怎么样？"],
["可敦","大汗……是儿子还是女儿？"],
["旁白","大汗看了一眼襁褓中的婴儿，平静地回答。"],
["大汗","是儿子，我们的第一个儿子。"],
["旁白","稳婆心中明白，襁褓里分明是个女孩。可她不敢违逆大汗的决定。"],
["旁白","于是，这个女孩自出生起，便被当作草原王子抚养。"],
["旁白","巫医为孩子留下狼王图腾。那是部族给予新生王子的祝福。"],
["大汗","从今日起，你便叫乞颜阿古拉。"],
["旁白","草原的风仍在吹。一个王子的故事，就此开始。"],
["旁白","第一章结束。"]
]},
{title:"少年情结义安达",theme:"grass",lines:[
["旁白","时光流转，阿古拉渐渐长大。草原上的生活教会他骑马、射箭，也让他逐渐显露出过人的天赋。"],
["旁白","年幼的阿古拉已经能够拉开小软弓，并在五步之外射中靶心。"],
["旁白","大汗为孩子的表现感到骄傲，甚至牵来一匹小马驹作为奖励。"],
["旁白","然而，阿古拉却更喜欢父亲的黑马黑风。"],
["旁白","在草原上，少年人的情谊与承诺，也在这样的岁月里慢慢生根。"],
["旁白","第二章结束。"]
]},
{title:"天赐神迹降宝驹",theme:"grass",lines:[
["旁白","草原辽阔，骏马奔腾。对于一个草原上的孩子而言，马不仅是伙伴，也是力量与自由的象征。"],
["旁白","阿古拉与马之间，似乎有着旁人难以理解的联系。"],
["旁白","人们将这份与生俱来的亲近视作神迹，认为这是天神给予草原的恩赐。"],
["旁白","一匹与众不同的骏马，也将成为阿古拉成长道路上的重要记忆。"],
["旁白","第三章结束。"]
]},
{title:"献女不成埋祸种",theme:"tent",lines:[
["旁白","撑犁部与图巴部之间的关系并不平静。部族之间的利益、婚约与权势，牵动着草原各方。"],
["旁白","阿古拉与吉雅同岁。围绕两个孩子的安排，一场涉及婚约与部族关系的交涉正在发生。"],
["旁白","大人们的决定，看似只是眼前的一桩婚事，却为日后的矛盾埋下了种子。"],
["旁白","第四章结束。"]
]},
{title:"引外族草原祸起",theme:"night",lines:[
["旁白","草原各部之间的暗流逐渐汇聚。原本看似遥远的纷争，终于一步步逼近撑犁部。"],
["旁白","外族势力介入，局势开始失控。"],
["旁白","曾经纵横草原的力量，也将迎来前所未有的考验。"],
["旁白","第五章结束。"]
]},
{title:"四海定君臣间隙",theme:"palace",lines:[
["旁白","草原与渭国之间的关系，牵涉的不只是疆土，还有君臣、宗嗣与礼法。"],
["旁白","不同的制度与立场，让双方的矛盾愈发难以调和。"],
["旁白","一场更大的风暴，已经悄然逼近。"],
["旁白","第六章结束。"]
]},
{title:"国破家亡不自知",theme:"night",lines:[
["旁白","战火席卷而来。对于草原上的人们而言，曾经熟悉的生活在一夜之间变得陌生。"],
["旁白","南宫静女仍在父亲身边。她尚不知道，远方的战事将如何改变许多人的命运。"],
["旁白","北泾的命运，也在这场战争中走向转折。"],
["旁白","第七章结束。"]
]},
{title:"浴火涅槃讨血仇",theme:"snow",lines:[
["旁白","故国覆灭，旧日生活不复存在。曾经的草原王子，也从此走上截然不同的道路。"],
["旁白","复仇成为支撑她活下去的执念。"],
["旁白","她必须隐藏过去，忍耐伤痛，在漫长岁月中等待机会。"],
["旁白","第八章结束。"]
]},
{title:"前尘雨打风吹去",theme:"night",lines:[
["旁白","十年光阴，足以让许多事物面目全非。"],
["旁白","过去的名字与身份被收进记忆深处，一个新的身份逐渐出现在世人面前。"],
["旁白","昔日草原上的经历，并没有真正离开她。"],
["旁白","第九章结束。"]
]},
{title:"良心未泯仇与苦",theme:"palace",lines:[
["旁白","复仇的道路并不意味着心中再无其他情绪。"],
["旁白","仇恨、怜悯与无法轻易割舍的良知，在她心中彼此拉扯。"],
["旁白","有些选择，并不能简单地用对错来衡量。"],
["旁白","第十章结束。"]
]},
{title:"结新友步步为营",theme:"palace",lines:[
["旁白","进入新的环境后，齐颜开始结识新的人，也逐渐熟悉周围的规则。"],
["旁白","每一次交谈、每一次试探，都可能影响未来的布局。"],
["旁白","她需要谨慎地向前走，不能让自己的真实目的暴露。"],
["旁白","第十一章结束。"]
]},
{title:"赠字无心种因果",theme:"palace",lines:[
["旁白","一次看似寻常的赠字，成为两个人之间新的交集。"],
["旁白","落笔之时或许并未多想，留下的字却可能在日后生出意想不到的因果。"],
["旁白","人与人之间的缘分，有时正是从这样细小的事情开始。"],
["旁白","第十二章结束。"]
]},
{title:"因差错二女品扇",theme:"palace",lines:[
["旁白","一把扇子，让两位女子产生了新的交集。"],
["旁白","原本因差错而起的事情，在言语与观察之间渐渐有了别样意味。"],
["旁白","有些误会，也在不经意间留下了印象。"],
["旁白","第十三章结束。"]
]},
{title:"解异梦凶相初显",theme:"night",lines:[
["旁白","梦境与现实交错，隐约显露出不祥的征兆。"],
["旁白","某些看似无关紧要的细节，开始呈现出不同寻常的意味。"],
["旁白","平静之下，暗流并未停止。"],
["旁白","第十四章结束。"]
]},
{title:"只道当时已惘然",theme:"palace",lines:[
["旁白","许多事情发生时，人往往并不知道它们将会带来什么。"],
["旁白","一次相遇、一句言语，或一个未曾留意的眼神，都可能在记忆中留下痕迹。"],
["旁白","待到后来回望，才知道当时的心绪早已悄然改变。"],
["旁白","第十五章结束。"]
]},
{title:"舐犊情深暗谋划",theme:"palace",lines:[
["旁白","身处权力中心的人，各有自己的牵挂与打算。"],
["旁白","亲情与权谋并行，表面上的平静之下，计划正在悄悄展开。"],
["旁白","有些安排，只有等到时机成熟才会显露。"],
["旁白","第十六章结束。"]
]},
{title:"愿者独坐钓鱼台",theme:"palace",lines:[
["旁白","局势逐渐明朗，有人选择主动出手，也有人耐心等待。"],
["旁白","看似置身事外的人，未必真的没有自己的盘算。"],
["旁白","棋局之中，愿者自会入局。"],
["旁白","第十七章结束。"]
]},
{title:"龙门开故友重逢",theme:"palace",lines:[
["旁白","一场重要的相逢终于到来。"],
["旁白","昔日的故人与如今的处境之间，隔着漫长的岁月，也隔着各自不同的经历。"],
["旁白","重逢并不意味着一切都能回到从前。"],
["旁白","第十八章结束。"]
]},
{title:"沧海桑田断肠人",theme:"night",lines:[
["旁白","岁月改变了许多东西。曾经熟悉的人与事，如今再看，已是另一番模样。"],
["旁白","那些无法轻易说出口的情绪，也在此刻变得更加沉重。"],
["旁白","有些故人，终究只能在回忆中相见。"],
["旁白","第十九章结束。"]
]},
{title:"蟾宫折桂马由缰",theme:"palace",lines:[
["旁白","科举之路终于迎来结果。"],
["旁白","名次、才学与前途，在这一刻成为众人瞩目的焦点。"],
["旁白","齐颜的人生，也因此进入新的阶段。"],
["旁白","第二十章结束。"]
]},

let chapterIndex=0;
let lineIndex=0;
let typing=false;
let fullText="";
let timer=null;
let auto=false;
let autoTimer=null;
let speed=35;
let view="齐颜";
let muted=true;
let volume=.2;
let audio=null;
let audioGain=null;

const $=id=>document.getElementById(id);
function current(){return chapters[chapterIndex]}
function showToast(message){
 const t=$("toast");t.textContent=message;t.style.opacity=1;
 clearTimeout(showToast.timer);
 showToast.timer=setTimeout(()=>t.style.opacity=0,1800);
}
function chooseView(v){
 view=v;
 $("viewSelect").value=v;
 showToast("已选择"+v+"视角");
}
function changeView(v){view=v;showToast("叙事视角已切换")}
function startGame(){
 $("titleScreen").style.display="none";
 render();
 startAudio();
}
function render(){
 const c=current();
 $("chapterLabel").textContent="第"+(chapterIndex+1)+"章 · 上部";
 $("chapterTitle").textContent=c.title;
 $("scene").className=c.theme;
 $("progress").style.width=((chapterIndex*100/chapters.length))+"%";
 $("viewSelect").value=view;
 showLine();
}
function showLine(){
 clearInterval(timer);
 const item=current().lines[lineIndex];
 if(!item)return;
 $("speaker").textContent=item[0]==="心中所想"?view+" · 心中所想":item[0];
 fullText=item[1];
 $("line").textContent="";
 typing=true;
 let i=0;
 timer=setInterval(()=>{
  if(i<fullText.length){
   $("line").textContent+=fullText.charAt(i++);
  }else{
   clearInterval(timer);typing=false;
  }
 },speed);
 $("counter").textContent=(lineIndex+1)+" / "+current().lines.length;
}
function advance(){
 if($("titleScreen").style.display!=="none")return;
 if(typing){
  clearInterval(timer);$("line").textContent=fullText;typing=false;return;
 }
 if(lineIndex<current().lines.length-1){
  lineIndex++;showLine();return;
 }
 if(chapterIndex<chapters.length-1){
  chapterIndex++;lineIndex=0;render();return;
 }
 showToast("第一至三十章已阅读完毕");
}
function previousLine(){
 if(typing){clearInterval(timer);$("line").textContent=fullText;typing=false;return}
 if(lineIndex>0){lineIndex--;showLine()}
 else if(chapterIndex>0){
  chapterIndex--;lineIndex=chapters[chapterIndex].lines.length-1;
  render();showLine();$("line").textContent=fullText;typing=false;
 }
}
function toggleAuto(){
 auto=!auto;
 $("autoBtn").classList.toggle("primary",auto);
 $("autoBtn").textContent=auto?"停止":"自动";
 if(auto)autoStep();
 else clearTimeout(autoTimer);
}
function autoStep(){
 if(!auto)return;
 if(typing){
  clearInterval(timer);$("line").textContent=fullText;typing=false;
  autoTimer=setTimeout(autoStep,1200);
 }else{
  advance();
  autoTimer=setTimeout(autoStep,2200);
 }
}
function openChapters(){
 buildChapterList();$("chapterOverlay").classList.add("show");
}
function buildChapterList(){
 $("chapterList").innerHTML="";
 chapters.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="chapter-item"+(i===chapterIndex?" current":"");
  const small=document.createElement("small");
  small.textContent="第"+(i+1)+"章";
  const strong=document.createElement("strong");
  strong.textContent=c.title;
  b.append(small,strong);
  b.onclick=()=>{chapterIndex=i;lineIndex=0;render();closeOverlay("chapterOverlay")};
  $("chapterList").appendChild(b);
 });
}
function openSettings(){$("settingsOverlay").classList.add("show")}
function closeOverlay(id){$(id).classList.remove("show")}
function setTextSpeed(v){speed=100-v;if(typing)showLine()}
function setVolume(v){
 volume=v/100;
 if(audioGain)audioGain.gain.value=muted?0:volume*.035;
}
function startAudio(){
 try{
  if(audio)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audio=new AC();
  audioGain=audio.createGain();
  audioGain.gain.value=0;
  audioGain.connect(audio.destination);
  const osc=audio.createOscillator();
  const osc2=audio.createOscillator();
  osc.type="sine";osc.frequency.value=110;
  osc2.type="sine";osc2.frequency.value=164.81;
  const g2=audio.createGain();g2.gain.value=.22;
  osc.connect(audioGain);osc2.connect(g2);g2.connect(audioGain);
  osc.start();osc2.start();
  audioGain.gain.value=muted?0:volume*.035;
 }catch(e){}
}
function toggleMute(){
 muted=!muted;
 startAudio();
 if(audioGain)audioGain.gain.value=muted?0:volume*.035;
 showToast(muted?"音乐已静音":"音乐已开启");
}
function saveGame(){
 try{
  localStorage.setItem("jingwei_save",JSON.stringify({
   chapterIndex,lineIndex,view,speed,volume,muted
  }));
  showToast("存档成功");
 }catch(e){showToast("当前浏览器无法存档")}
}
function loadGame(){
 try{
  const data=JSON.parse(localStorage.getItem("jingwei_save"));
  if(!data){showToast("没有找到存档");return}
  chapterIndex=Math.min(Math.max(data.chapterIndex||0,0),chapters.length-1);
  lineIndex=Math.min(Math.max(data.lineIndex||0,0),chapters[chapterIndex].lines.length-1);
  view=data.view||"齐颜";speed=data.speed||35;
  volume=data.volume??.2;muted=data.muted??true;
  $("musicVolume").value=volume*100;
  $("textSpeed").value=100-speed;
  $("viewSelect").value=view;
  render();
  showToast("读档成功");
 }catch(e){showToast("读取存档失败")}
}
document.addEventListener("keydown",e=>{
 if(e.key===" "||e.key==="Enter"){
  if(!$("chapterOverlay").classList.contains("show")&&!$("settingsOverlay").classList.contains("show")){
   e.preventDefault();advance();
  }
 }
 if(e.key==="Escape"){
  closeOverlay("chapterOverlay");closeOverlay("settingsOverlay");
 }
});
</script>
