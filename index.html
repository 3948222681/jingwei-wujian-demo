
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18221f">
<title>泾渭无间｜互动视觉小说</title>
<style>
:root{--ink:#202a26;--jade:#b8c9bd;--paper:#f1f0e8;--muted:#c7d0c8;--gold:#d8c69d;--line:#ffffff35;--glass:#17211edb;--soft:#e8eee8;--shadow:0 20px 70px #06100c55}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101815;color:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #d7e4d9;outline-offset:3px}
.hidden{display:none!important}

/* 柔焦背景 */
.screen{min-height:100svh;position:relative;overflow:hidden;background:#17211e}
.backdrop{
 position:absolute;inset:-2%;
 background:
 radial-gradient(ellipse at 22% 28%,#8b9b8660 0%,transparent 42%),
 radial-gradient(ellipse at 78% 24%,#596d665c 0%,transparent 44%),
 radial-gradient(ellipse at 54% 80%,#263c36 0%,#111b19 72%);
 transform:scale(1.08);
 filter:blur(19px) saturate(.78);
 transition:background 1s ease,filter 1s ease
}
.backdrop:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,#111b18a6 0%,#111b1840 55%,#111b1866 100%),linear-gradient(0deg,#101815e8 0%,transparent 66%)
}
.home-backdrop{
 background:
 radial-gradient(ellipse at 50% 24%,#a6a88d66 0%,transparent 45%),
 radial-gradient(ellipse at 15% 75%,#536e5d 0%,transparent 48%),
 linear-gradient(145deg,#253d36,#111b19);
 filter:blur(24px) brightness(.78)
}
.game-backdrop[data-mood=calm]{
 background:
 radial-gradient(ellipse at 28% 24%,#a1a58b72 0%,transparent 46%),
 radial-gradient(ellipse at 78% 72%,#496a596b 0%,transparent 45%),
 linear-gradient(145deg,#354d42,#111c1b)
}
.game-backdrop[data-mood=tender]{
 background:
 radial-gradient(ellipse at 70% 22%,#a88d8066 0%,transparent 43%),
 radial-gradient(ellipse at 20% 70%,#63796b72 0%,transparent 48%),
 linear-gradient(145deg,#43574e,#17201f)
}
.game-backdrop[data-mood=tense]{
 background:
 radial-gradient(ellipse at 70% 24%,#76645f80 0%,transparent 45%),
 radial-gradient(ellipse at 18% 76%,#354c4c 0%,transparent 50%),
 linear-gradient(145deg,#343c3b,#101719)
}
.game-backdrop[data-mood=urgent]{
 background:
 radial-gradient(ellipse at 70% 25%,#9a6b5966 0%,transparent 42%),
 radial-gradient(ellipse at 18% 78%,#34464b 0%,transparent 48%),
 linear-gradient(145deg,#3b3432,#101719)
}

/* 首页 */
#home{display:grid;place-items:center;padding:26px}
.home-content{
 position:relative;z-index:1;width:min(900px,100%);
 text-align:center;padding:52px 28px 38px
}
.eyebrow{font:11px/1.6 Arial,sans-serif;letter-spacing:.34em;color:#d9dfd6;text-transform:uppercase}
.home-title{
 font-size:clamp(46px,8vw,92px);font-weight:400;letter-spacing:.24em;
 margin:20px 0 10px;text-indent:.24em;text-shadow:0 4px 30px #0008
}
.home-sub{font-size:13px;letter-spacing:.3em;color:#e1e7df;margin-bottom:34px}
.home-desc{font-size:14px;line-height:2.1;color:#e3e8e1c9;letter-spacing:.08em}
.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0 26px}
.btn-primary,.btn-ghost{
 border-radius:999px;padding:13px 30px;letter-spacing:.16em;font-size:13px;transition:.22s
}
.btn-primary{background:#e6ece4;color:#26342e;border:1px solid #f3f6f0;box-shadow:0 8px 26px #0003}
.btn-primary:hover{background:white;transform:translateY(-2px)}
.btn-ghost{background:#f5f7f018;color:#f5f7f0;border:1px solid #ffffff70;backdrop-filter:blur(12px)}
.btn-ghost:hover{background:#ffffff24}
.perspective-select{
 margin:22px auto 0;display:flex;align-items:center;justify-content:center;
 gap:9px;flex-wrap:wrap;color:#e3e8e1c9;font-size:12px;letter-spacing:.12em
}
.perspective-select button{
 border:1px solid #ffffff55;background:#ffffff12;color:#f2f4ed;
 border-radius:999px;padding:9px 17px;font-size:12px;transition:.2s
}
.perspective-select button.selected,.perspective-select button:hover{
 background:#e6ece4;color:#26342e;border-color:#e6ece4
}
.perspective-note{width:100%;font-size:10px;color:#e0e6df99;letter-spacing:.05em;margin-top:2px}
.creator{font-size:12px;letter-spacing:.2em;color:#e0e6df;margin-top:24px}
.legal{max-width:720px;margin:20px auto 0;font:11px/1.9 sans-serif;color:#e0e6dfad}
.home-foot{position:absolute;z-index:1;bottom:20px;left:0;right:0;text-align:center;font:10px sans-serif;letter-spacing:.12em;color:#e0e6df8c}

/* 游戏界面 */
#game{display:none;min-height:100svh}
.game-backdrop{position:fixed}
.game-top{
 position:absolute;z-index:3;top:0;left:0;right:0;
 display:flex;align-items:center;justify-content:space-between;
 padding:calc(18px + env(safe-area-inset-top)) clamp(16px,4vw,52px) 14px;
 background:linear-gradient(180deg,#1018159c,transparent)
}
.game-brand{font-size:12px;letter-spacing:.22em;color:#e8eee8d9}
.chapter-meta{text-align:right}
.chapter-kicker{display:none!important}
.chapter-name{font-size:15px;letter-spacing:.12em;margin-top:5px;color:#f1f3ed}
.toolbar{
 position:absolute;z-index:5;top:calc(70px + env(safe-area-inset-top));
 right:clamp(14px,4vw,52px);display:flex;gap:7px
}
.tool{
 display:flex;align-items:center;gap:7px;border:1px solid #ffffff3d;
 border-radius:999px;padding:8px 13px;background:#18231fc2;color:#eef1e9;
 font-size:11px;backdrop-filter:blur(14px);transition:.2s
}
.tool:hover{background:#e9eee8;color:#24312b}
.tool .ico{font-size:14px;line-height:1}
.scene-label{
 position:absolute;z-index:2;left:clamp(18px,5vw,64px);top:45%;
 font-size:11px;letter-spacing:.26em;color:#edf1e6a3;
 text-shadow:0 2px 12px #0008;writing-mode:vertical-rl
}
.dialogue-wrap{
 position:absolute;z-index:4;left:0;right:0;bottom:0;
 padding:0 clamp(14px,5vw,70px) calc(22px + env(safe-area-inset-bottom));
 background:linear-gradient(0deg,#101815f2 0%,#101815d9 68%,#10181500 100%)
}
.dialogue-inner{width:min(1120px,100%);margin:0 auto;padding-top:56px}
.speaker-line{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.speaker-mark{width:7px;height:7px;border-radius:50%;background:#d7c69f;box-shadow:0 0 14px #d7c69f80}
.speaker-name{font-size:14px;letter-spacing:.14em;color:#e6d7b4}
.speaker-kind{font:10px sans-serif;letter-spacing:.12em;color:#c5d0c5a0}
.dialogue-text{
 font-size:clamp(16px,2vw,21px);line-height:2;letter-spacing:.045em;
 color:#f5f4ed;min-height:2.1em;text-shadow:0 1px 8px #0006;
 max-width:1000px;white-space:pre-wrap;cursor:pointer
}
.dialogue-hint{
 display:flex;align-items:center;justify-content:space-between;
 margin-top:18px;color:#dbe2d9a0;font:10px sans-serif;letter-spacing:.12em
}
.next-caret{display:inline-block;margin-left:8px;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.15}}
.choices{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));
 gap:10px;margin-top:22px;max-width:1000px
}
.choice{
 border:1px solid #e3ece055;border-radius:18px;background:#dfe9e21c;
 color:#f2f4ed;text-align:left;padding:14px 18px;font-size:13px;
 line-height:1.75;backdrop-filter:blur(14px);transition:.22s
}
.choice:hover{background:#e6eee6e8;color:#26352d;border-color:#e6eee6;transform:translateY(-2px)}
.choice .num{font:10px sans-serif;letter-spacing:.12em;color:#d9c99f;margin-right:12px}
.choice:hover .num{color:#627768}
.view-pick{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.view-pick .choice{min-width:190px}
.status-note{font:10px sans-serif;color:#dce4dca0;margin-top:12px;letter-spacing:.1em}

/* 浮层 */
.overlay{
 display:none;position:fixed;z-index:20;inset:0;background:#08100dd9;
 backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:18px
}
.overlay.open{display:flex}
.panel{
 width:min(720px,100%);max-height:min(82svh,760px);overflow:auto;
 border:1px solid #dfe9df35;border-radius:22px;background:#18231ff2;
 box-shadow:var(--shadow);padding:24px
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-title{font-size:18px;font-weight:400;letter-spacing:.12em}
.close{border:0;background:transparent;color:#dce5dc;font-size:25px;padding:2px 8px}
.history-list{display:grid;gap:0}
.history-item{padding:13px 2px;border-bottom:1px solid #ffffff18}
.history-speaker{font-size:11px;color:#d9c99f;letter-spacing:.12em;margin-bottom:5px}
.history-text{font-size:13px;line-height:1.9;color:#eef0e9}
.history-item button{
 margin-top:8px;border:1px solid #ffffff30;border-radius:99px;
 padding:6px 12px;color:#e7eee6;background:#ffffff0c;font-size:10px
}
.setting-row{
 display:flex;align-items:center;justify-content:space-between;gap:16px;
 padding:14px 0;border-bottom:1px solid #ffffff18;font-size:13px;color:#eef1e9
}
.setting-row input[type=range]{width:min(230px,50%);accent-color:#c7d7c8}
.setting-row input[type=checkbox]{accent-color:#c7d7c8;width:18px;height:18px}
.setting-sub{font-size:11px;color:#c2cec2a0;line-height:1.8;margin-top:14px}
.log-empty{font-size:13px;color:#c2cec2a0;padding:24px 0}
.toast{
 position:fixed;z-index:40;bottom:calc(22px + env(safe-area-inset-bottom));
 left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:99px;
 background:#e9eee8;color:#26352d;font:12px sans-serif;
 box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s
}
.toast.show{opacity:1}

@media(max-width:700px){
 .home-content{padding:40px 10px 32px}
 .home-title{letter-spacing:.16em;text-indent:.16em}
 .home-desc{font-size:13px}
 .game-top{padding-left:16px;padding-right:16px}
 .game-brand{font-size:10px}
 .chapter-name{font-size:13px}
 .toolbar{top:calc(72px + env(safe-area-inset-top));left:12px;right:12px;justify-content:center;gap:5px}
 .tool{padding:8px 11px;font-size:10px}
 .tool .label{display:none}
 .scene-label{top:34%;left:14px}
 .dialogue-wrap{padding-left:17px;padding-right:17px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
 .dialogue-inner{padding-top:44px}
 .dialogue-text{font-size:16px;line-height:1.95}
 .choices{grid-template-columns:1fr;gap:8px;margin-top:16px}
 .choice{padding:12px 15px}
 .dialogue-hint{margin-top:12px}
 .panel{padding:19px;border-radius:18px}
 .setting-row{font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="home" class="screen">
 <div class="backdrop home-backdrop"></div>
 <div class="home-content">
  <div class="eyebrow">AN UNOFFICIAL INTERACTIVE FAN WORK</div>
  <h1 class="home-title">泾渭无间</h1>
  <div class="home-sub">山河有界 · 人心无间</div>
  <div class="home-desc">一段故事，两种目光。<br>在每一次抉择之间，重新走近她们的命运。</div>

  <div class="perspective-select">
   <span>选择叙事视角</span>
   <button id="pickQi" class="selected" onclick="pickPerspective('qi')">齐颜</button>
   <button id="pickJing" onclick="pickPerspective('jing')">南宫静女</button>
   <div class="perspective-note">视角会在原著人物实际参与的章节中开放；不影响原著主线。</div>
  </div>

  <div class="home-actions">
   <button class="btn-primary" onclick="startGame()">开始故事</button>
   <button class="btn-ghost" onclick="continueGame()">继续故事</button>
   <button class="btn-ghost" onclick="openPanel('about')">制作与版权</button>
  </div>
  <div class="creator">制作人 · 27教主</div>
  <div class="legal">本作品为非官方同人互动创作，与原著作者及版权方无官方关联。原著名称、人物及相关知识产权归其各自权利人所有。剧情文字、界面与素材分别遵循其对应权利及许可；非商业声明不代表自动取得原著授权。</div>
 </div>
 <div class="home-foot">一段故事，从此开始</div>
</section>

<section id="game" class="screen">
 <div id="sceneBg" class="backdrop game-backdrop"></div>
 <header class="game-top">
  <div class="game-brand">泾渭无间 <span style="opacity:.5">/</span> 互动故事</div>
  <div class="chapter-meta">
   <div class="chapter-kicker" id="chapterKicker"></div>
   <div class="chapter-name" id="chapterName">齐颜</div>
  </div>
 </header>

 <div class="toolbar">
  <button class="tool" onclick="openPanel('chapters')"><span class="ico">卷</span><span class="label">章节</span></button>
  <button class="tool" onclick="openPanel('history')"><span class="ico">☷</span><span class="label">回看</span></button>
  <button class="tool" onclick="rollback()"><span class="ico">↶</span><span class="label">回档</span></button>
  <button class="tool" id="autoBtn" onclick="toggleAuto()"><span class="ico">▷</span><span class="label">自动</span></button>
  <button class="tool" onclick="openPanel('settings')"><span class="ico">⚙</span><span class="label">设置</span></button>
  <button class="tool" onclick="saveGame()"><span class="ico">⌑</span><span class="label">存档</span></button>
 </div>

 <div class="scene-label" id="sceneLabel">王帐 · 黎明</div>

 <div class="dialogue-wrap" id="dialogueWrap">
  <div class="dialogue-inner" id="advanceArea" onclick="advance()">
   <div class="speaker-line">
    <span class="speaker-mark"></span>
    <span class="speaker-name" id="speakerName">旁白</span>
    <span class="speaker-kind" id="speakerKind"></span>
   </div>
   <div class="dialogue-text" id="dialogueText"></div>
   <div class="dialogue-hint">
    <span id="hintText">点击继续</span>
    <span>继续 <span class="next-caret">⌄</span></span>
   </div>
  </div>
  <div id="choiceArea" class="choices hidden"></div>
  <div id="viewArea" class="view-pick hidden"></div>
  <div id="nodeNote" class="status-note"></div>
 </div>
</section>

<div class="overlay" id="panel" onclick="if(event.target===this)closePanel()">
 <div class="panel">
  <div class="panel-head">
   <div class="panel-title" id="panelTitle">剧情回看</div>
   <button class="close" onclick="closePanel()">×</button>
  </div>
  <div id="panelBody"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 本版不使用任何场景图片，背景由柔焦色彩与光影渐层构成。
const chapters=[
 {
  id:'birth',
  kicker:'',
  title:'便把娇娥作儿郎',
  place:'王帐 · 黎明',
  views:['qi'],
  mood:'calm',
  scripts:{
   qi:[
    {speaker:'旁白',kind:'',text:'北泾草原，风越过无边的草场。大汗接到王帐传来的消息：可敦即将生产。',type:'narration'},
    {speaker:'旁白',kind:'',text:'他立刻赶回王帐。帐中已经响起婴儿的啼哭，芙蓉平安产下一名孩子。',type:'narration'},
    {speaker:'芙蓉',kind:'',text:'大汗……孩子是男是女？',type:'dialogue'},
    {speaker:'旁白',kind:'',text:'大汗望向襁褓，明知那是个女婴，却向众人宣告：这是他的儿子。',type:'narration'},
    {speaker:'旁白',kind:'',text:'从这一刻起，孩子将以王子的身份长大。知晓真相的人沉默下来，王帐里没有人再提起那个秘密。',type:'narration'},
    {speaker:'旁白',kind:'',text:'巫医为新生的孩子留下狼王图腾。大汗废除与图巴部的联姻安排，册封芙蓉为可敦，并为孩子取名——乞颜阿古拉。',type:'narration'},
    {choices:[
     ['留意大汗的决定与王帐中的权力变化。','father'],
     ['将目光放在狼王图腾与新生王子的祝福上。','totem']
    ]},
    {conditional:{
     father:{speaker:'旁白',kind:'',text:'大汗的决定不仅改变了一个孩子的身份，也将改变王帐中每个人此后的处境。'},
     totem:{speaker:'旁白',kind:'',text:'狼王图腾落在孩子身上。祝福与秘密同时降临，这个名字从此被草原记住。'}
    }},
    {speaker:'旁白',kind:'',text:'帐外天光渐亮。草原上的新一天开始了。',type:'narration'}
   ]
  }
 },
 {
  id:'meeting',
  kicker:'',
  title:'廊下听风',
  place:'一段原创互动演绎 · 午后',
  views:['qi','jing'],
  mood:'tender',
  scripts:{
   qi:[
    {speaker:'齐颜',kind:'心中所想',text:'廊外风过竹梢，几片叶子落在石阶边。我放慢脚步，听见前方有人说话。',type:'thought'},
    {speaker:'齐颜',kind:'心中所想',text:'有些相遇，起初并没有特别之处。只是后来回想，才发现那一刻早已被记住。',type:'thought'},
    {choices:[
     ['循着声音走近一些。','greet'],
     ['暂且停步，不惊动廊下的人。','observe']
    ]},
    {conditional:{
     greet:{speaker:'旁白',kind:'',text:'你选择主动靠近。廊下的风声渐渐远去，交谈即将开始。'},
     observe:{speaker:'旁白',kind:'',text:'你选择暂时旁观。隔着一段距离，先将眼前的情形收入眼底。'}
    }},
    {speaker:'齐颜',kind:'心中所想',text:'这一刻的细节，后来都成了记忆里的一部分。',type:'thought'}
   ],
   jing:[
    {speaker:'南宫静女',kind:'心中所想',text:'午后的园子很静，风吹过水面，碎光落在廊前。',type:'thought'},
    {speaker:'南宫静女',kind:'心中所想',text:'远处似乎有人停下了脚步。我抬眼望去，想看看来人是否有话要说。',type:'thought'},
    {choices:[
     ['先开口，打破这片安静。','ask'],
     ['暂且不说话，等对方先开口。','wait']
    ]},
    {conditional:{
     ask:{speaker:'旁白',kind:'',text:'你选择先开口。话音落下，原本安静的廊下有了新的声息。'},
     wait:{speaker:'旁白',kind:'',text:'你选择静静等待。短暂的沉默，让这次相遇多了几分试探。'}
    }},
    {speaker:'南宫静女',kind:'心中所想',text:'有时人与人之间的距离，便从一句话或一次沉默开始改变。',type:'thought'}
   ]
  }
 }
];

let preferredView='qi';
let currentItem=null;
let state={
 chapter:0,view:'qi',index:0,history:[],choices:[],
 completedViews:[],auto:false,typing:false,completed:false,lastChoice:''
};
let typeTimer=null,autoTimer=null,charIndex=0,currentLine='';
let audioCtx=null,masterGain=null,musicTimer=null;
let musicOn=true,musicVolume=.24,effectVolume=.35,moodNow='calm';
let typeSpeed=36;
const $=id=>document.getElementById(id);

function activeScript(){return chapters[state.chapter].scripts[state.view]||[]}

function pickPerspective(v){
 preferredView=v;
 document.getElementById('pickQi').classList.toggle('selected',v==='qi');
 document.getElementById('pickJing').classList.toggle('selected',v==='jing');
}
function setPreferredView(v){
 preferredView=v;state.preferredView=v;
 toast('已调整叙事偏好');saveGame(true);
}

function startGame(){
 stopAuto();
 state={
  chapter:0,view:'qi',preferredView,
  index:0,history:[],choices:[],completedViews:[],
  auto:false,typing:false,completed:false,lastChoice:''
 };
 $('home').style.display='none';
 $('game').style.display='block';
 renderScene();showCurrent();unlockAudio();
}

function continueGame(){
 let raw=localStorage.getItem('jingwei-save-v2');
 if(!raw){toast('还没有存档，已为你开启新故事');startGame();return}
 try{
  state=JSON.parse(raw);
  state.auto=false;state.typing=false;
  state.completedViews=state.completedViews||[];
  preferredView=state.preferredView||state.view||'qi';
  $('home').style.display='none';
  $('game').style.display='block';
  renderScene();showCurrent();
  toast('已读取本设备存档');unlockAudio();
 }catch(e){toast('存档读取失败，已开启新故事');startGame()}
}

function renderScene(){
 let c=chapters[state.chapter];
 $('chapterKicker').textContent='';
 $('chapterName').textContent=c.title;
 $('sceneLabel').textContent=c.place;
 $('sceneBg').dataset.mood=c.mood;
 moodNow=c.mood;startMusic(c.mood);
}

function showCurrent(){
 clearType();
 let script=activeScript();
 let item=script[state.index];
 if(item&&item.conditional){
  item=item.conditional[state.lastChoice]||Object.values(item.conditional)[0];
 }
 currentItem=item;
 $('choiceArea').classList.add('hidden');
 $('viewArea').classList.add('hidden');
 $('advanceArea').classList.remove('hidden');
 $('nodeNote').textContent='';
 if(!item){showChapterEnd();return}

 if(item.choices){
  $('advanceArea').classList.add('hidden');
  let box=$('choiceArea');box.innerHTML='';
  item.choices.forEach((choice,i)=>{
   let b=document.createElement('button');
   b.className='choice';
   b.innerHTML=`<span class="num">${['壹','贰','叁','肆'][i]}</span>${escapeHtml(choice[0])}`;
   b.onclick=()=>choose(choice[1],choice[0]);
   box.appendChild(b);
  });
  box.classList.remove('hidden');
  $('nodeNote').textContent='请作出选择';
  stopAuto();return;
 }

 $('advanceArea').onclick=advance;
 $('speakerName').textContent=item.speaker||'旁白';
 $('speakerKind').textContent=item.kind||'';
 $('hintText').textContent='文字逐字显现 · 点击可显示全文';
 currentLine=item.text||'';
 $('dialogueText').textContent='';
 charIndex=0;state.typing=true;
 let speed=typeSpeed;
 typeTimer=setInterval(()=>{
  charIndex++;
  $('dialogueText').textContent=currentLine.slice(0,charIndex);
  if(charIndex>=currentLine.length){
   clearType();state.typing=false;
   $('hintText').textContent='点击继续';
   if(state.auto)scheduleAuto();
  }
 },speed);
}

function clearType(){
 if(typeTimer){clearInterval(typeTimer);typeTimer=null}
}

function advance(){
 if($('game').style.display==='none'||$('advanceArea').classList.contains('hidden'))return;
 if(state.typing){
  clearType();$('dialogueText').textContent=currentLine;
  state.typing=false;$('hintText').textContent='点击继续';return;
 }
 let item=currentItem;
 if(!item)return;
 state.history.push({
  chapter:state.chapter,view:state.view,
  speaker:item.speaker||'旁白',kind:item.kind||'',text:item.text||''
 });
 state.index++;saveGame(true);showCurrent();
}

function choose(id,label){
 state.lastChoice=id;
 state.choices.push({chapter:state.chapter,view:state.view,label,index:state.index});
 state.history.push({chapter:state.chapter,view:state.view,speaker:'选择',kind:'',text:label});
 state.index++;saveGame(true);
 if(id==='listen'||id==='observe'||id==='wait')effectTone('soft');
 else effectTone('bright');
 showCurrent();
}

function nextChapter(){
 let next=state.chapter+1;
 if(next>=chapters.length){toast('故事暂告一段落');backHome();return}
 state.chapter=next;
 state.view=chapters[next].views.includes(preferredView)?preferredView:chapters[next].views[0];
 state.index=0;state.completed=false;
 renderScene();showCurrent();saveGame(true);
}

function showViewSelection(){
 stopAuto();clearType();
 $('advanceArea').classList.add('hidden');
 $('choiceArea').classList.add('hidden');
 let box=$('viewArea');box.innerHTML='';box.classList.remove('hidden');
 $('nodeNote').textContent='选择你想跟随的目光。';
 chapters[state.chapter].views.forEach(v=>{
  let b=document.createElement('button');
  b.className='choice';
  b.textContent='以'+(v==='qi'?'齐颜':'南宫静女')+'的视角继续';
  b.onclick=()=>{
   state.view=v;state.index=0;box.classList.add('hidden');
   renderScene();showCurrent();saveGame(true);
  };
  box.appendChild(b);
 });
}

function switchView(v){
 if(!chapters[state.chapter].views.includes(v))return;
 state.view=v;state.index=0;state.completed=false;
 $('advanceArea').onclick=advance;
 renderScene();showCurrent();
}

function rollback(){
 stopAuto();
 if(state.index>0){
  state.index=Math.max(0,state.index-1);
  let last=state.history.pop();
  saveGame(true);renderScene();showCurrent();
  toast('已回到上一段剧情');
 }else if(state.chapter>0){
  state.chapter--;
  state.view=chapters[state.chapter].views[0];
  state.index=0;renderScene();showCurrent();
  toast('已回到上一段');
 }else toast('已经是故事的起点');
}

function showChapterEnd(){
 stopAuto();clearType();
 let key=state.chapter+':'+state.view;
 if(!state.completedViews.includes(key))state.completedViews.push(key);
 $('advanceArea').classList.add('hidden');
 $('choiceArea').classList.add('hidden');
 let box=$('viewArea');box.classList.remove('hidden');box.innerHTML='';
 $('nodeNote').textContent='';
 let c=chapters[state.chapter];
 let other=c.views.find(v=>v!==state.view&&!state.completedViews.includes(state.chapter+':'+v));
 if(other){
  let b=document.createElement('button');
  b.className='choice';b.textContent='换一个视角';
  b.onclick=()=>switchView(other);box.appendChild(b);
 }
 let n=document.createElement('button');
 n.className='choice';
 n.textContent=state.chapter<chapters.length-1?'继续前行':'回到首页';
 n.onclick=()=>state.chapter<chapters.length-1?nextChapter():backHome();
 box.appendChild(n);saveGame(true);
}

function saveGame(silent=false){
 let clean={...state,preferredView,typing:false,auto:false};
 localStorage.setItem('jingwei-save-v2',JSON.stringify(clean));
 if(!silent)toast('进度已保存在本设备');
}
function resetGame(){
 if(confirm('确定从头开始？当前设备上的存档将被覆盖。')){
  localStorage.removeItem('jingwei-save-v2');startGame();
 }
}
function backHome(){
 stopAuto();$('game').style.display='none';$('home').style.display='grid';
}

function openPanel(which){
 stopAuto();let title='',body='';
 if(which==='chapters'){
  title='故事目录';
  body='<div class="history-list">'+chapters.map((c,i)=>
   `<div class="history-item"><div class="history-text">${escapeHtml(c.title)}</div><button onclick="openChapter(${i})">阅读</button></div>`
  ).join('')+'</div>';
 }else if(which==='history'){
  title='剧情回看';
  body=state.history.length?
   '<div class="history-list">'+state.history.map((h,i)=>
    `<div class="history-item"><div class="history-speaker">${escapeHtml(h.speaker)}${h.kind?' · '+escapeHtml(h.kind):''}</div><div class="history-text">${escapeHtml(h.text)}</div><button onclick="jumpHistory(${i})">回到这里</button></div>`
   ).join('')+'</div>':
   '<div class="log-empty">还没有读过的剧情。</div>';
 }else if(which==='settings'){
  title='声音与显示设置';
  body=`<div class="setting-row"><span>叙事视角</span><div>
   <button style="background:#ffffff12;color:#eee;border:1px solid #ffffff33;border-radius:30px;padding:7px 12px" onclick="setPreferredView('qi')">齐颜</button>
   <button style="background:#ffffff12;color:#eee;border:1px solid #ffffff33;border-radius:30px;padding:7px 12px" onclick="setPreferredView('jing')">南宫静女</button>
  </div></div>
  <div class="setting-row"><span>背景音乐</span><label><input id="musicToggle" type="checkbox" ${musicOn?'checked':''} onchange="setMusicOn(this.checked)"> 开启</label></div>
  <div class="setting-row"><span>音乐音量</span><input type="range" min="0" max="100" value="${Math.round(musicVolume*100)}" oninput="setMusicVolume(this.value)"></div>
  <div class="setting-row"><span>音效音量</span><input type="range" min="0" max="100" value="${Math.round(effectVolume*100)}" oninput="setEffectVolume(this.value)"></div>
  <div class="setting-row"><span>文字速度</span><input type="range" min="15" max="80" value="36" oninput="typeSpeed=Number(this.value)"></div>
  <div class="setting-sub">本演示使用浏览器合成的原创氛围音色。关闭音乐或静音不会影响剧情。</div>`;
 }else{
  title='制作与版权说明';
  body='<p class="history-text">制作人：27教主</p>'+
   '<p class="history-text">本作品为非官方同人互动创作，与《泾渭情殇》原著作者及相关版权方无官方关联。原著名称、人物及相关知识产权归其各自权利人所有。本作品不代表原作者立场，非商业声明不等于取得原著授权。</p>'+
   '<p class="history-text">本版不使用场景图片，背景由柔焦色彩、雾感光影与渐层构成。</p>'+
   '<p class="history-text">互动选项用于呈现观察角度、人物心绪与关系细节，不改写原著主线。标注为原创演绎的段落属于同人创作，不代表原著情节。</p>';
 }
 $('panelTitle').textContent=title;
 $('panelBody').innerHTML=body;
 $('panel').classList.add('open');
}

function openChapter(i){
 closePanel();
 state.chapter=i;
 state.view=chapters[i].views.includes(preferredView)?preferredView:chapters[i].views[0];
 state.index=0;state.completed=false;
 renderScene();showCurrent();saveGame(true);
}
function closePanel(){$('panel').classList.remove('open')}

function jumpHistory(i){
 let item=state.history[i];if(!item)return;
 state.chapter=item.chapter;state.view=item.view;
 let seen=state.history.slice(0,i+1);state.history=seen;
 let count=0;
 for(let j=0;j<=i;j++){
  let h=state.history[j];
  if(h.chapter===item.chapter&&h.view===item.view)count++;
 }
 state.index=Math.max(0,count-1);
 closePanel();renderScene();showCurrent();
 toast('已回到所选剧情位置');saveGame(true);
}

function toggleAuto(){
 state.auto=!state.auto;
 $('autoBtn').querySelector('.ico').textContent=state.auto?'Ⅱ':'▷';
 $('autoBtn').querySelector('.label').textContent=state.auto?'暂停':'自动';
 if(state.auto){if(!state.typing)scheduleAuto()}
 else stopAuto();
}
function scheduleAuto(){
 if(!state.auto)return;
 clearTimeout(autoTimer);autoTimer=setTimeout(()=>advance(),1700);
}
function stopAuto(){
 state.auto=false;clearTimeout(autoTimer);
 $('autoBtn')&&($('autoBtn').querySelector('.ico').textContent='▷',$('autoBtn').querySelector('.label').textContent='自动');
}
function toast(t){
 let el=$('toast');el.textContent=t;el.classList.add('show');
 clearTimeout(window._toastTimer);
 window._toastTimer=setTimeout(()=>el.classList.remove('show'),2100);
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 原创合成氛围音乐
function unlockAudio(){
 try{
  if(!audioCtx){
   audioCtx=new(window.AudioContext||window.webkitAudioContext)();
   masterGain=audioCtx.createGain();
   masterGain.gain.value=musicOn?musicVolume:0;
   masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
  startMusic(moodNow);
 }catch(e){}
}
function tone(freq,duration,gain=.06,wave='sine',when=0){
 if(!audioCtx||!masterGain||!musicOn)return;
 let osc=audioCtx.createOscillator(),g=audioCtx.createGain();
 osc.type=wave;osc.frequency.value=freq;
 g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);
 g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),audioCtx.currentTime+when+.12);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+duration);
 osc.connect(g);g.connect(masterGain);
 osc.start(audioCtx.currentTime+when);
 osc.stop(audioCtx.currentTime+when+duration+.05);
}
function startMusic(mood){
 if(!audioCtx||!musicOn)return;
 clearInterval(musicTimer);
 let sets={
  calm:[261.63,329.63,392,523.25],
  tender:[293.66,349.23,440,587.33],
  tense:[220,261.63,311.13,415.3],
  urgent:[196,246.94,293.66,392]
 };
 let notes=sets[mood]||sets.calm;let n=0;
 musicTimer=setInterval(()=>{
  if(!musicOn)return;
  let f=notes[n%notes.length];tone(f,2.5,.028,'sine');
  if(mood==='tense'||mood==='urgent')tone(f*.5,1.8,.025,'triangle',.15);
  n++;
 },2200);
}
function setMusicOn(v){
 musicOn=v;unlockAudio();
 if(masterGain)masterGain.gain.setTargetAtTime(musicOn?musicVolume:0,audioCtx.currentTime,.08);
 if(musicOn)startMusic(moodNow);else clearInterval(musicTimer);
}
function setMusicVolume(v){
 musicVolume=Number(v)/100;
 if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(musicOn?musicVolume:0,audioCtx.currentTime,.06);
}
function setEffectVolume(v){effectVolume=Number(v)/100}
function effectTone(kind){
 if(!audioCtx||effectVolume<=0)return;
 let f=kind==='bright'?660:440,osc=audioCtx.createOscillator(),g=audioCtx.createGain();
 osc.type='triangle';osc.frequency.value=f;
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(Math.max(.0002,.035*effectVolume),audioCtx.currentTime+.025);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);
 osc.connect(g);g.connect(audioCtx.destination);
 osc.start();osc.stop(audioCtx.currentTime+.24);
}
window.addEventListener('keydown',e=>{
 if(e.key==='Escape')closePanel();
 if(e.key===' '&&$('game').style.display!=='none'&&!$('panel').classList.contains('open')){
  e.preventDefault();advance();
 }
});
</script>
</body>
