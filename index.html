
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14251e">
<title>泾渭无间｜秘密入口</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(ellipse at center, #344b3e 0%, #1b2d24 65%, #111e18 100%);
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

/* 密码入口 */
.gate {
    width: 100%;
    max-width: 680px;
    padding: 65px 52px;
    border-radius: 42px;
    background: linear-gradient(145deg, #e1e8dc, #cbd8ca);
    color: #24372d;
    text-align: center;
    box-shadow: 0 25px 80px rgba(0,0,0,.3);
}

.english {
    font-size: 17px;
    line-height: 2;
    letter-spacing: 5px;
    color: #819083;
    margin-bottom: 32px;
}

.gate h1 {
    font-size: clamp(38px, 8vw, 58px);
    font-weight: 400;
    letter-spacing: 9px;
    margin: 0 0 28px;
}

.description {
    font-size: clamp(17px, 4vw, 24px);
    line-height: 1.9;
    color: #65776b;
    margin: 0 0 38px;
}

.password-input {
    display: block;
    width: 100%;
    height: 98px;
    padding: 15px;
    border: 2px solid #aab8ab;
    border-radius: 27px;
    background: #f6f8f4;
    color: #24372d;
    font-size: 23px;
    text-align: center;
    outline: none;
}

.password-input:focus {
    border-color: #526e5b;
}

.password-input::placeholder {
    color: #b0b4b0;
}

.enter-button {
    width: 100%;
    height: 98px;
    margin-top: 24px;
    border: 2px solid #526d5a;
    border-radius: 60px;
    background: #34513f;
    color: white;
    font-size: 30px;
    letter-spacing: 5px;
    cursor: pointer;
    transition: background .2s;
}

.enter-button:active {
    background: #243d2e;
}

.error {
    min-height: 28px;
    margin: 16px 0 0;
    color: #a34b42;
    font-size: 16px;
}

.disclaimer {
    margin-top: 55px;
    color: #819083;
    font-size: 16px;
    letter-spacing: 1.5px;
}

/* 陷阱页面 */
.trap-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #000;
    text-align: center;
}

.trap-card {
    width: 100%;
    max-width: 1100px;
    min-height: 575px;
    padding: 35px 25px;
    border-radius: 42px;
    background: #101010;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.warning-icon {
    color: #f5c542;
    font-size: 76px;
    line-height: 1;
    margin-bottom: 45px;
}

.trap-card h1 {
    margin: 0 0 35px;
    color: #fff;
    font-size: clamp(35px, 7vw, 76px);
    font-weight: bold;
}

.trap-subtitle {
    margin: 0 0 35px;
    color: #aaa;
    font-size: clamp(19px, 4vw, 48px);
}

.trap-card h2 {
    margin: 0 0 35px;
    color: #f5c542;
    font-size: clamp(30px, 5vw, 55px);
}

.trap-footer {
    margin: 0;
    color: #888;
    font-size: clamp(18px, 3vw, 38px);
}

/* 手机显示调整 */
@media (max-width: 600px) {
    .gate {
        padding: 55px 30px;
        border-radius: 34px;
    }

    .english {
        font-size: 12px;
        letter-spacing: 3px;
    }

    .password-input,
    .enter-button {
        height: 76px;
        font-size: 20px;
    }

    .disclaimer {
        font-size: 12px;
        margin-top: 42px;
    }

    .trap-card {
        min-height: 500px;
        padding: 25px 15px;
        border-radius: 35px;
    }

    .warning-icon {
        font-size: 65px;
        margin-bottom: 35px;
    }
}
</style>
</head>

<body>

<!-- 原来的密码页面 -->
<main class="gate" id="gate">

    <div class="english">
        A PRIVATE FAN-MADE INTERACTIVE<br>
        STORY
    </div>

    <h1>泾渭无间</h1>

    <p class="description">
        此间有约，请验密入内。<br>
        请输入访问密码，开启这一段故事。
    </p>

    <form id="password-form">
        <input
            id="password"
            class="password-input"
            type="password"
            placeholder="请输入访问密码"
            autocomplete="off"
            required
        >

        <button class="enter-button" type="submit">
            验密入内
        </button>

        <p class="error" id="error"></p>
    </form>

    <div class="disclaimer">
        UNOFFICIAL FAN WORK · NON-COMMERCIAL
    </div>

</main>

<!-- 密码正确后显示的陷阱页面 -->
<section class="trap-screen" id="trap-screen">

    <div class="trap-card">

        <div class="warning-icon">⚠</div>

        <h1>你掉进陷阱了😂</h1>

        <p class="trap-subtitle">
            恭喜你发现了一个秘密入口……
        </p>

        <h2>才怪！🤣</h2>

        <p class="trap-footer">
    请带着你的好奇心原路返回。
</p>

<h2>你可以滚了乐乐😂</h2>

    </div>

</section>

<script>

/* ================================
   在这里设置你自己的密码
   ================================ */

const SECRET_PASSWORD = "JingWei-8266!";


/* 密码验证 */
document.getElementById("password-form")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const enteredPassword =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    if (enteredPassword === SECRET_PASSWORD) {

        // 隐藏原来的密码页面
        document.getElementById("gate").style.display = "none";

        // 显示嘲讽陷阱页面
        document.getElementById("trap-screen").style.display = "flex";

        // 修改浏览器标题
        document.title = "你掉进陷阱了😂";

    } else {

        error.textContent = "密码不正确，请重新输入。";

        document.getElementById("password").value = "";

    }

});

</script>

</body>
</html>
