.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin-top:22px;max-width:1000px}.choice{border:1px solid #e3ece055;border-radius:18px;background:#dfe9e21c;color:#f2f4ed;text-align:left;padding:14px 18px;font-size:13px;line-height:1.75;backdrop-filter:blur(14px);transition:.22s}.choice:hover{background:#e6eee6e8;color:#26352d;border-color:#e6eee6;transform:translateY(-2px)}.choice .num{font:10px sans-serif;letter-spacing:.12em;color:#d9c99f;margin-right:12px}.choice:hover .num{color:#627768}.view-pick{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.view-pick .choice{min-width:190px}.status-note{font:10px sans-serif;color:#dce4dca0;margin-top:12px;letter-spacing:.1em}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<section id="home" class="screen">
 <div class="backdrop home-backdrop"></div>

function backHome(){stopAuto();$('game').style.display='none';$('home').style.display='grid'}
function openPanel(which){stopAuto();let title='',body='';if(which==='chapters'){title='章节目录';body='<div class="history-list">'+chapters.map((c,i)=>`<div class="history-item"><div class="history-speaker">${escapeHtml(c.kicker)}</div><div class="history-text">${escapeHtml(c.title)}</div><button onclick="openChapter(${i})">进入本章</button></div>`).join('')+'</div>'}else if(which==='history'){title='剧情回看';body=state.history.length?'<div class="history-list">'+state.history.map((h,i)=>`<div class="history-item"><div class="history-speaker">${escapeHtml(h.speaker)}${h.kind?' · '+escapeHtml(h.kind):''}</div><div class="history-text">${escapeHtml(h.text)}</div><button onclick="jumpHistory(${i})">回到这里</button></div>`).join('')+'</div>':'<div class="log-empty">还没有读过的剧情。</div>'}else if(which==='settings'){title='声音与显示设置';body=`<div class="setting-row"><span>背景音乐</span><label><input id="musicToggle" type="checkbox" ${musicOn?'checked':''} onchange="setMusicOn(this.checked)"> 开启</label></div><div class="setting-row"><span>音乐音量</span><input type="range" min="0" max="100" value="${Math.round(musicVolume*100)}" oninput="setMusicVolume(this.value)"></div><div class="setting-row"><span>音效音量</span><input type="range" min="0" max="100" value="${Math.round(effectVolume*100)}" oninput="setEffectVolume(this.value)"></div><div class="setting-row"><span>文字速度</span><input type="range" min="15" max="80" value="36" oninput="typeSpeed=Number(this.value)"></div><div class="setting-sub">当前背景音乐为浏览器合成的氛围音色。关闭音乐或静音不会影响剧情。</div>`}else{title='制作与版权说明';body='<p class="history-text">制作人：27教主</p><p class="history-text">本作品为非官方同人互动创作，与《泾渭情殇》原著作者及相关版权方无官方关联。原著名称、人物及相关知识产权归其各自权利人所有。本作品不代表原作者立场，非商业声明不等于取得原著授权。</p><p class="history-text">本版本按原著前30章顺序制作剧情梗概与互动演绎，人物对话及旁白为本同人作品重新撰写，并非原著正文。互动选项只改变当下回应与叙述感受，不改变原著主线。</p><p class="history-text">章节标题与公开章节信息参考晋江文学城《泾渭情殇》，作者请君莫笑。建议支持正版阅读原著。</p>'} $('panelTitle').textContent=title;$('panelBody').innerHTML=body;$('panel').classList.add('open')}
function openChapter(i){closePanel();state.chapter=i;state.view=chapters[i].views[0];state.index=0;state.completed=false;renderScene();if(chapters[i].views.length>1)showViewSelection();else showCurrent();saveGame(true)}
function closePanel(){$('panel').classList.remove('open')}
function jumpHistory(i){let item=state.history[i];if(!item)return;state.chapter=item.chapter;state.view=item.view;let seen=state.history.slice(0,i+1);state.history=seen;let count=0;for(let j=0;j<=i;j++){let h=state.history[j];if(h.chapter===item.chapter&&h.view===item.view)count++}state.index=Math.max(0,count-1);closePanel();renderScene();showCurrent();toast('已回到所选剧情位置');saveGame(true)}
function toggleAuto(){state.auto=!state.auto;$('autoBtn').querySelector('.ico').textContent=state.auto?'Ⅱ':'▷';$('autoBtn').querySelector('.label').textContent=state.auto?'暂停':'自动';if(state.auto){if(!state.typing)scheduleAuto()}else stopAuto()}
function scheduleAuto(){if(!state.auto)return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>advance(),1700)}function stopAuto(){state.auto=false;clearTimeout(autoTimer);$('autoBtn')&&($('autoBtn').querySelector('.ico').textContent='▷',$('autoBtn').querySelector('.label').textContent='自动')}
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Original synthesized ambient score; audio starts only after a user gesture.
let typeSpeed=36;
function unlockAudio(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=musicOn?musicVolume:0;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();startMusic(moodNow)}catch(e){}}
function tone(freq,duration,gain=.06,wave='sine',when=0){if(!audioCtx||!masterGain||!musicOn)return;let osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=wave;osc.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),audioCtx.currentTime+when+.12);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+duration);osc.connect(g);g.connect(masterGain);osc.start(audioCtx.currentTime+when);osc.stop(audioCtx.currentTime+when+duration+.05)}
function startMusic(mood){if(!audioCtx||!musicOn)return;clearInterval(musicTimer);let sets={calm:[261.63,329.63,392,523.25],tender:[293.66,349.23,440,587.33],tense:[220,261.63,311.13,415.3],urgent:[196,246.94,293.66,392]};let notes=sets[mood]||sets.calm;let n=0;musicTimer=setInterval(()=>{if(!musicOn)return;let f=notes[n%notes.length];tone(f,2.5,.028,'sine');if(mood==='tense'||mood==='urgent')tone(f*.5,1.8,.025,'triangle',.15);n++},2200)}
function setMusicOn(v){musicOn=v;unlockAudio();if(masterGain)masterGain.gain.setTargetAtTime(musicOn?musicVolume:0,audioCtx.currentTime,.08);if(musicOn)startMusic(moodNow);else clearInterval(musicTimer)}
function setMusicVolume(v){musicVolume=Number(v)/100;if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(musicOn?musicVolume:0,audioCtx.currentTime,.06)}
function setEffectVolume(v){effectVolume=Number(v)/100}
function effectTone(kind){if(!audioCtx||effectVolume<=0)return;let f=kind==='bright'?660:440,osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='triangle';osc.frequency.value=f;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.0002,.035*effectVolume),audioCtx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.24)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key===' '&&$('game').style.display!=='none'&&!$('panel').classList.contains('open')){e.preventDefault();advance()}});
</script>
</body>
</html>
