<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18221f">
<title>泾渭无间｜互动视觉小说</title>
<style>
:root{--ink:#202a26;--jade:#b8c9bd;--paper:#f1f0e8;--muted:#c7d0c8;--gold:#d8c69d;--line:#ffffff35;--glass:#17211edb;--soft:#e8eee8;--shadow:0 20px 70px #06100c55}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101815;color:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d7e4d9;outline-offset:3px}.hidden{display:none!important}
/* Shared atmosphere */
.screen{min-height:100svh;position:relative;overflow:hidden;background:#17211e}.backdrop{position:absolute;inset:0;background-image:linear-gradient(180deg,#10191520 0%,#10191512 40%,#101915b8 100%),url('https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Classical_Gardens_of_Suzhou_pavilion%2C_August_2016.jpg/1280px-Classical_Gardens_of_Suzhou_pavilion%2C_August_2016.jpg');background-size:cover;background-position:center 48%;transform:scale(1.015);filter:saturate(.76) contrast(.98);transition:opacity .8s ease,background-position 1.2s ease}.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#111b18a6 0%,#111b1840 55%,#111b1866 100%),linear-gradient(0deg,#101815e8 0%,transparent 66%)}
/* Landing */
#home{display:grid;place-items:center;padding:26px}.home-backdrop{background-position:center 52%;filter:saturate(.65) brightness(.72)}.home-content{position:relative;z-index:1;width:min(900px,100%);text-align:center;padding:52px 28px 38px}.eyebrow{font:11px/1.6 Arial,sans-serif;letter-spacing:.34em;color:#d9dfd6;text-transform:uppercase}.home-title{font-size:clamp(46px,8vw,92px);font-weight:400;letter-spacing:.24em;margin:20px 0 10px;text-indent:.24em;text-shadow:0 4px 30px #0008}.home-sub{font-size:13px;letter-spacing:.3em;color:#e1e7df;margin-bottom:34px}.home-desc{font-size:14px;line-height:2.1;color:#e3e8e1c9;letter-spacing:.08em}.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:36px 0 26px}.btn-primary,.btn-ghost{border-radius:999px;padding:13px 30px;letter-spacing:.16em;font-size:13px;transition:.22s}.btn-primary{background:#e6ece4;color:#26342e;border:1px solid #f3f6f0;box-shadow:0 8px 26px #0003}.btn-primary:hover{background:white;transform:translateY(-2px)}.btn-ghost{background:#f5f7f018;color:#f5f7f0;border:1px solid #ffffff70;backdrop-filter:blur(12px)}.btn-ghost:hover{background:#ffffff24}.creator{font-size:12px;letter-spacing:.2em;color:#e0e6df;margin-top:24px}.legal{max-width:720px;margin:20px auto 0;font:11px/1.9 sans-serif;color:#e0e6dfad}.home-foot{position:absolute;z-index:1;bottom:20px;left:0;right:0;text-align:center;font:10px sans-serif;letter-spacing:.12em;color:#e0e6df8c}
/* Game */
#game{display:none;min-height:100svh}.game-backdrop{position:fixed}.game-top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) clamp(16px,4vw,52px) 14px;background:linear-gradient(180deg,#1018159c,transparent)}.game-brand{font-size:12px;letter-spacing:.22em;color:#e8eee8d9}.chapter-meta{text-align:right}.chapter-kicker{font:10px sans-serif;letter-spacing:.2em;color:#d7e0d7a8}.chapter-name{font-size:15px;letter-spacing:.12em;margin-top:5px;color:#f1f3ed}.toolbar{position:absolute;z-index:5;top:calc(70px + env(safe-area-inset-top));right:clamp(14px,4vw,52px);display:flex;gap:7px}.tool{display:flex;align-items:center;gap:7px;border:1px solid #ffffff3d;border-radius:999px;padding:8px 13px;background:#18231fc2;color:#eef1e9;font-size:11px;backdrop-filter:blur(14px);transition:.2s}.tool:hover{background:#e9eee8;color:#24312b}.tool .ico{font-size:14px;line-height:1}.scene-label{position:absolute;z-index:2;left:clamp(18px,5vw,64px);top:45%;font-size:11px;letter-spacing:.26em;color:#edf1e6a3;text-shadow:0 2px 12px #0008;writing-mode:vertical-rl}
.dialogue-wrap{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:0 clamp(14px,5vw,70px) calc(22px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#101815f2 0%,#101815d9 68%,#10181500 100%)}.dialogue-inner{width:min(1120px,100%);margin:0 auto;padding-top:56px}.speaker-line{display:flex;align-items:center;gap:11px;margin-bottom:12px}.speaker-mark{width:7px;height:7px;border-radius:50%;background:#d7c69f;box-shadow:0 0 14px #d7c69f80}.speaker-name{font-size:14px;letter-spacing:.14em;color:#e6d7b4}.speaker-kind{font:10px sans-serif;letter-spacing:.12em;color:#c5d0c5a0}.dialogue-text{font-size:clamp(16px,2vw,21px);line-height:2;letter-spacing:.045em;color:#f5f4ed;min-height:2.1em;text-shadow:0 1px 8px #0006;max-width:1000px;white-space:pre-wrap;cursor:pointer}.dialogue-hint{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:#dbe2d9a0;font:10px sans-serif;letter-spacing:.12em}.next-caret{display:inline-block;margin-left:8px;animation:blink 1.1s infinite}@keyframes blink{50%{opacity:.15}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin-top:22px;max-width:1000px}.choice{border:1px solid #e3ece055;border-radius:18px;background:#dfe9e21c;color:#f2f4ed;text-align:left;padding:14px 18px;font-size:13px;line-height:1.75;backdrop-filter:blur(14px);transition:.22s}.choice:hover{background:#e6eee6e8;color:#26352d;border-color:#e6eee6;transform:translateY(-2px)}.choice .num{font:10px sans-serif;letter-spacing:.12em;color:#d9c99f;margin-right:12px}.choice:hover .num{color:#627768}.view-pick{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.view-pick .choice{min-width:190px}.status-note{font:10px sans-serif;color:#dce4dca0;margin-top:12px;letter-spacing:.1em}
/* overlays */
.overlay{display:none;position:fixed;z-index:20;inset:0;background:#08100dd9;backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.panel{width:min(720px,100%);max-height:min(82svh,760px);overflow:auto;border:1px solid #dfe9df35;border-radius:22px;background:#18231ff2;box-shadow:var(--shadow);padding:24px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel-title{font-size:18px;font-weight:400;letter-spacing:.12em}.close{border:0;background:transparent;color:#dce5dc;font-size:25px;padding:2px 8px}.history-list{display:grid;gap:0}.history-item{padding:13px 2px;border-bottom:1px solid #ffffff18}.history-speaker{font-size:11px;color:#d9c99f;letter-spacing:.12em;margin-bottom:5px}.history-text{font-size:13px;line-height:1.9;color:#eef0e9}.history-item button{margin-top:8px;border:1px solid #ffffff30;border-radius:99px;padding:6px 12px;color:#e7eee6;background:#ffffff0c;font-size:10px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #ffffff18;font-size:13px;color:#eef1e9}.setting-row input[type=range]{width:min(230px,50%);accent-color:#c7d7c8}.setting-row input[type=checkbox]{accent-color:#c7d7c8;width:18px;height:18px}.setting-sub{font-size:11px;color:#c2cec2a0;line-height:1.8;margin-top:14px}.log-empty{font-size:13px;color:#c2cec2a0;padding:24px 0}.toast{position:fixed;z-index:40;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:#e9eee8;color:#26352d;font:12px sans-serif;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
@media(max-width:700px){.home-content{padding:40px 10px 32px}.home-title{letter-spacing:.16em;text-indent:.16em}.home-desc{font-size:13px}.game-top{padding-left:16px;padding-right:16px}.game-brand{font-size:10px}.chapter-name{font-size:13px}.toolbar{top:calc(72px + env(safe-area-inset-top));left:12px;right:12px;justify-content:center;gap:5px}.tool{padding:8px 11px;font-size:10px}.tool .label{display:none}.scene-label{top:34%;left:14px}.dialogue-wrap{padding-left:17px;padding-right:17px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.dialogue-inner{padding-top:44px}.dialogue-text{font-size:16px;line-height:1.95}.choices{grid-template-columns:1fr;gap:8px;margin-top:16px}.choice{padding:12px 15px}.dialogue-hint{margin-top:12px}.panel{padding:19px;border-radius:18px}.setting-row{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="home" class="screen">
 <div class="backdrop home-backdrop"></div>
 <div class="home-content">
  <div class="eyebrow">AN UNOFFICIAL INTERACTIVE FAN WORK</div>
  <h1 class="home-title">泾渭无间</h1>
  <div class="home-sub">山河有界 · 人心无间</div>
  <div class="home-desc">一段故事，两种目光。<br>在每一次抉择之间，重新走近她们的命运。</div>
  <div class="home-actions"><button class="btn-primary" onclick="startGame()">开始故事</button><button class="btn-ghost" onclick="continueGame()">继续故事</button><button class="btn-ghost" onclick="openPanel('about')">制作与版权</button></div>
  <div class="creator">制作人 · 27教主</div>
  <div class="legal">本作品为非官方同人互动创作，与原著作者及版权方无官方关联。原著名称、人物及相关知识产权归其各自权利人所有。剧情文字、界面与素材分别遵循其对应权利及许可；非商业声明不代表自动取得原著授权。</div>
 </div>
 <div class="home-foot">建议佩戴耳机体验 · 手机与电脑均可游玩</div>
</section>

<section id="game" class="screen">
 <div id="sceneBg" class="backdrop game-backdrop"></div>
 <header class="game-top"><div class="game-brand">泾渭无间 <span style="opacity:.5">/</span> 互动故事</div><div class="chapter-meta"><div class="chapter-kicker" id="chapterKicker">序章</div><div class="chapter-name" id="chapterName">齐颜</div></div></header>
 <div class="toolbar">
  <button class="tool" onclick="openPanel('chapters')"><span class="ico">卷</span><span class="label">章节</span></button>
  <button class="tool" onclick="openPanel('history')"><span class="ico">☷</span><span class="label">回看</span></button>
  <button class="tool" onclick="rollback()"><span class="ico">↶</span><span class="label">回档</span></button>
  <button class="tool" id="autoBtn" onclick="toggleAuto()"><span class="ico">▷</span><span class="label">自动</span></button>
  <button class="tool" onclick="openPanel('settings')"><span class="ico">⚙</span><span class="label">设置</span></button>
  <button class="tool" onclick="saveGame()"><span class="ico">⌑</span><span class="label">存档</span></button>
 </div>
 <div class="scene-label" id="sceneLabel">场景 · 宫苑</div>
 <div class="dialogue-wrap" id="dialogueWrap">
  <div class="dialogue-inner" id="advanceArea" onclick="advance()">
   <div class="speaker-line"><span class="speaker-mark"></span><span class="speaker-name" id="speakerName">齐颜</span><span class="speaker-kind" id="speakerKind">心中所想</span></div>
   <div class="dialogue-text" id="dialogueText"></div>
   <div class="dialogue-hint"><span id="hintText">点击继续</span><span>继续 <span class="next-caret">⌄</span></span></div>
  </div>
  <div id="choiceArea" class="choices hidden"></div>
  <div id="viewArea" class="view-pick hidden"></div>
  <div id="nodeNote" class="status-note"></div>
 </div>
</section>

<div class="overlay" id="panel" onclick="if(event.target===this)closePanel()"><div class="panel"><div class="panel-head"><div class="panel-title" id="panelTitle">剧情回看</div><button class="close" onclick="closePanel()">×</button></div><div id="panelBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
// 场景照片：Jason Zhang 拍摄的苏州古典园林亭榭，Wikimedia Commons，CC0。
const sceneImage='https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Classical_Gardens_of_Suzhou_pavilion%2C_August_2016.jpg/1280px-Classical_Gardens_of_Suzhou_pavilion%2C_August_2016.jpg';
const chapters=[
 {id:'birth',kicker:'序章 · 第一章',title:'齐颜出生',place:'场景 · 室内 / 黎明',views:['qi'],mood:'calm',demo:true,
  scripts:{qi:[
   {speaker:'齐颜',kind:'心中所想',text:'我来到这世上的那一日，天色还未放亮。',type:'narration'},
   {speaker:'旁白',kind:'',text:'屋外的风声渐渐停了，晨光从窗纸边缘透进来。',type:'narration'},
   {speaker:'齐颜',kind:'心中所想',text:'后来许多年里，我才慢慢明白，人的一生会从许多细微之处开始。',type:'thought'},
   {choices:[['继续向前，记住这个清晨。','continue'],['停下来，听一听窗外的声音。','listen']]},
   {speaker:'齐颜',kind:'心中所想',text:'无论如何，我的故事已经开始了。',type:'thought'}
  ]}},
 {id:'meeting',kicker:'第一卷 · 相逢',title:'初次相遇',place:'场景 · 园林 / 午后',views:['qi','jing'],mood:'tender',demo:true,
  scripts:{qi:[
   {speaker:'齐颜',kind:'心中所想',text:'我原本只是经过那处园子，却在廊下听见了一阵清脆的笑声。',type:'thought'},
   {speaker:'齐颜',kind:'心中所想',text:'我循声望去，第一次见到了她。',type:'thought'},
   {choices:[['停下脚步，向她行礼。','greet'],['不贸然上前，先安静观察。','observe']]},
   {speaker:'齐颜',kind:'心中所想',text:'那一眼并不长，却在往后的岁月里，留下了很深的印记。',type:'thought'}
  ],jing:[
   {speaker:'南宫静女',kind:'心中所想',text:'午后的园子很静，廊外的水面映着一层浅浅的天光。',type:'thought'},
   {speaker:'南宫静女',kind:'心中所想',text:'我听见脚步声，转过头，看见一位陌生的年轻人。',type:'thought'},
   {choices:[['主动开口，问她从何处来。','ask'],['先看她一眼，再等她行礼。','wait']]},
   {speaker:'南宫静女',kind:'心中所想',text:'我那时还不知道，这次相遇会在记忆里停留多久。',type:'thought'}
  ]}}
];
let state={chapter:0,view:'qi',index:0,history:[],choices:[],completedViews:[],auto:false,typing:false,completed:false};
let typeTimer=null,autoTimer=null,charIndex=0,currentLine='';
let audioCtx=null,masterGain=null,musicTimer=null,musicOn=true,musicVolume=.24,effectVolume=.35,moodNow='calm';
const $=id=>document.getElementById(id);
function activeScript(){return chapters[state.chapter].scripts[state.view]||[]}
function startGame(){stopAuto();state={chapter:0,view:'qi',index:0,history:[],choices:[],completedViews:[],auto:false,typing:false,completed:false};$('home').style.display='none';$('game').style.display='block';renderScene();showCurrent();unlockAudio();}
function continueGame(){let raw=localStorage.getItem('jingwei-save-v2');if(!raw){toast('还没有存档，已为你开启新故事');startGame();return}try{state=JSON.parse(raw);state.auto=false;state.typing=false;state.completedViews=state.completedViews||[];$('home').style.display='none';$('game').style.display='block';renderScene();showCurrent();toast('已读取本设备存档');unlockAudio()}catch(e){toast('存档读取失败，已开启新故事');startGame()}}
function renderScene(){let c=chapters[state.chapter];$('chapterKicker').textContent=c.kicker;$('chapterName').textContent=c.title;$('sceneLabel').textContent=c.place;$('sceneBg').style.backgroundImage=`linear-gradient(180deg,#10191520 0%,#10191512 40%,#101915b8 100%),url('${sceneImage}')`;moodNow=c.mood;startMusic(c.mood);}
function showCurrent(){clearType();let script=activeScript();let item=script[state.index];$('choiceArea').classList.add('hidden');$('viewArea').classList.add('hidden');$('advanceArea').classList.remove('hidden');$('nodeNote').textContent='';if(!item){showChapterEnd();return}
 if(item.choices){$('advanceArea').classList.add('hidden');let box=$('choiceArea');box.innerHTML='';item.choices.forEach((choice,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${['壹','贰','叁','肆'][i]}</span>${escapeHtml(choice[0])}`;b.onclick=()=>choose(choice[1],choice[0]);box.appendChild(b)});box.classList.remove('hidden');$('nodeNote').textContent='请作出选择';stopAuto();return}
 $('advanceArea').onclick=advance;$('speakerName').textContent=item.speaker||'旁白';$('speakerKind').textContent=item.kind||'';$('hintText').textContent='文字逐字显现 · 点击可显示全文';currentLine=item.text||'';$('dialogueText').textContent='';charIndex=0;state.typing=true;let speed=typeSpeed;typeTimer=setInterval(()=>{charIndex++;$('dialogueText').textContent=currentLine.slice(0,charIndex);if(charIndex>=currentLine.length){clearType();state.typing=false;$('hintText').textContent='点击继续';if(state.auto)scheduleAuto()}},speed);}
function clearType(){if(typeTimer){clearInterval(typeTimer);typeTimer=null}}
function advance(){if($('game').style.display==='none'||$('advanceArea').classList.contains('hidden'))return;if(state.typing){clearType();$('dialogueText').textContent=currentLine;state.typing=false;$('hintText').textContent='点击继续';return}let item=activeScript()[state.index];if(!item)return;state.history.push({chapter:state.chapter,view:state.view,speaker:item.speaker||'旁白',kind:item.kind||'',text:item.text||''});state.index++;saveGame(true);showCurrent();}
function choose(id,label){state.choices.push({chapter:state.chapter,view:state.view,label,index:state.index});state.history.push({chapter:state.chapter,view:state.view,speaker:'选择',kind:'',text:label});state.index++;saveGame(true);if(id==='listen'||id==='observe'||id==='wait')effectTone('soft');else effectTone('bright');showCurrent();}

function nextChapter(){let next=state.chapter+1;if(next>=chapters.length){toast('当前演示章节已结束');backHome();return}state.chapter=next;state.view=chapters[next].views[0];state.index=0;state.completed=false;renderScene();if(chapters[next].views.length>1)showViewSelection();else showCurrent();saveGame(true)}
function showViewSelection(){stopAuto();clearType();$('advanceArea').classList.add('hidden');$('choiceArea').classList.add('hidden');let box=$('viewArea');box.innerHTML='';box.classList.remove('hidden');$('nodeNote').textContent='请选择这一章的叙事视角；不需要体验全部视角，也可以直接进入下一章。';chapters[state.chapter].views.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent='以'+(v==='qi'?'齐颜':'南宫静女')+'的视角开始';b.onclick=()=>{state.view=v;state.index=0;box.classList.add('hidden');renderScene();showCurrent();saveGame(true)};box.appendChild(b)})}
function switchView(v){if(!chapters[state.chapter].views.includes(v))return;state.view=v;state.index=0;state.completed=false;$('advanceArea').onclick=advance;renderScene();showCurrent();}
function rollback(){stopAuto();if(state.index>0){state.index=Math.max(0,state.index-1);let last=state.history.pop();if(last&&last.text){}saveGame(true);renderScene();showCurrent();toast('已回到上一段剧情')}else if(state.chapter>0){state.chapter--;state.view=chapters[state.chapter].views[0];state.index=0;renderScene();showCurrent();toast('已回到上一章')}else toast('已经是当前故事的起点')}
function showChapterEnd(){stopAuto();clearType();let key=state.chapter+':'+state.view;if(!state.completedViews.includes(key))state.completedViews.push(key);$('advanceArea').classList.add('hidden');$('choiceArea').classList.add('hidden');let box=$('viewArea');box.classList.remove('hidden');box.innerHTML='';$('nodeNote').textContent='本段故事暂告一段落。可以继续下一章，也可以体验另一位人物的视角；不会强制双视角通关。';let c=chapters[state.chapter];let other=c.views.find(v=>v!==state.view&&!state.completedViews.includes(state.chapter+':'+v));if(other){let b=document.createElement('button');b.className='choice';b.textContent='从'+(other==='qi'?'齐颜':'南宫静女')+'的视角再看这一段';b.onclick=()=>switchView(other);box.appendChild(b)}let n=document.createElement('button');n.className='choice';n.textContent=state.chapter<chapters.length-1?'进入下一章':'返回首页';n.onclick=()=>state.chapter<chapters.length-1?nextChapter():backHome();box.appendChild(n);saveGame(true)}
function saveGame(silent=false){let clean={...state,typing:false,auto:false};localStorage.setItem('jingwei-save-v2',JSON.stringify(clean));if(!silent)toast('进度已保存在本设备')}
function resetGame(){if(confirm('确定从头开始？当前设备上的存档将被覆盖。')){localStorage.removeItem('jingwei-save-v2');startGame()}}
function backHome(){stopAuto();$('game').style.display='none';$('home').style.display='grid'}
function openPanel(which){stopAuto();let title='',body='';if(which==='chapters'){title='章节目录';body='<div class="history-list">'+chapters.map((c,i)=>`<div class="history-item"><div class="history-speaker">${escapeHtml(c.kicker)}</div><div class="history-text">${escapeHtml(c.title)}</div><button onclick="openChapter(${i})">进入本章</button></div>`).join('')+'</div>'}else if(which==='history'){title='剧情回看';body=state.history.length?'<div class="history-list">'+state.history.map((h,i)=>`<div class="history-item"><div class="history-speaker">${escapeHtml(h.speaker)}${h.kind?' · '+escapeHtml(h.kind):''}</div><div class="history-text">${escapeHtml(h.text)}</div><button onclick="jumpHistory(${i})">回到这里</button></div>`).join('')+'</div>':'<div class="log-empty">还没有读过的剧情。</div>'}else if(which==='settings'){title='声音与显示设置';body=`<div class="setting-row"><span>背景音乐</span><label><input id="musicToggle" type="checkbox" ${musicOn?'checked':''} onchange="setMusicOn(this.checked)"> 开启</label></div><div class="setting-row"><span>音乐音量</span><input type="range" min="0" max="100" value="${Math.round(musicVolume*100)}" oninput="setMusicVolume(this.value)"></div><div class="setting-row"><span>音效音量</span><input type="range" min="0" max="100" value="${Math.round(effectVolume*100)}" oninput="setEffectVolume(this.value)"></div><div class="setting-row"><span>文字速度</span><input type="range" min="15" max="80" value="36" oninput="typeSpeed=Number(this.value)"></div><div class="setting-sub">本演示使用浏览器合成的原创氛围音色，正式版可替换为逐首核验授权的纯音乐。关闭音乐或静音不会影响剧情。</div>`}else{title='制作与版权说明';body='<p class="history-text">制作人：27教主</p><p class="history-text">本作品为非官方同人互动创作，与《泾渭情殇》原著作者及相关版权方无官方关联。原著名称、人物及相关知识产权归其各自权利人所有。本作品不代表原作者立场，非商业声明不等于取得原著授权。</p><p class="history-text">当前演示场景照片：Jason Zhang，《Classical Gardens of Suzhou pavilion, August 2016》，Wikimedia Commons，CC0 1.0。<a style="color:#d8c69d" target="_blank" rel="noopener" href="https://commons.wikimedia.org/wiki/File:Classical_Gardens_of_Suzhou_pavilion,_August_2016.jpg">查看素材来源与许可</a>。画面为真实园林摄影，当前预览未见人物。</p><p class="history-text">本版本的剧情段落仅为界面与交互演示，不是原著正文或正式改编章节；正式剧情需逐章核对原著并使用原创概述与表达。</p>'} $('panelTitle').textContent=title;$('panelBody').innerHTML=body;$('panel').classList.add('open')}
function openChapter(i){closePanel();state.chapter=i;state.view=chapters[i].views[0];state.index=0;state.completed=false;renderScene();if(chapters[i].views.length>1)showViewSelection();else showCurrent();saveGame(true)}
function closePanel(){$('panel').classList.remove('open')}
function jumpHistory(i){let item=state.history[i];if(!item)return;state.chapter=item.chapter;state.view=item.view;let seen=state.history.slice(0,i+1);state.history=seen;let count=0;for(let j=0;j<=i;j++){let h=state.history[j];if(h.chapter===item.chapter&&h.view===item.view)count++}state.index=Math.max(0,count-1);closePanel();renderScene();showCurrent();toast('已回到所选剧情位置');saveGame(true)}
function toggleAuto(){state.auto=!state.auto;$('autoBtn').querySelector('.ico').textContent=state.auto?'Ⅱ':'▷';$('autoBtn').querySelector('.label').textContent=state.auto?'暂停':'自动';if(state.auto){if(!state.typing)scheduleAuto()}else stopAuto()}
function scheduleAuto(){if(!state.auto)return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>advance(),1700)}function stopAuto(){state.auto=false;clearTimeout(autoTimer);$('autoBtn')&&($('autoBtn').querySelector('.ico').textContent='▷',$('autoBtn').querySelector('.label').textContent='自动')}
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Original synthesized ambient score; audio starts only after a user gesture.
let typeSpeed=36;
function unlockAudio(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=musicOn?musicVolume:0;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();startMusic(moodNow)}catch(e){}}
function tone(freq,duration,gain=.06,wave='sine',when=0){if(!audioCtx||!masterGain||!musicOn)return;let osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=wave;osc.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),audioCtx.currentTime+when+.12);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+duration);osc.connect(g);g.connect(masterGain);osc.start(audioCtx.currentTime+when);osc.stop(audioCtx.currentTime+when+duration+.05)}
function startMusic(mood){if(!audioCtx||!musicOn)return;clearInterval(musicTimer);let sets={calm:[261.63,329.63,392,523.25],tender:[293.66,349.23,440,587.33],tense:[220,261.63,311.13,415.3],urgent:[196,246.94,293.66,392]};let notes=sets[mood]||sets.calm;let n=0;musicTimer=setInterval(()=>{if(!musicOn)return;let f=notes[n%notes.length];tone(f,2.5,.028,'sine');if(mood==='tense'||mood==='urgent')tone(f*.5,1.8,.025,'triangle',.15);n++},2200)}
function setMusicOn(v){musicOn=v;unlockAudio();if(masterGain)masterGain.gain.setTargetAtTime(musicOn?musicVolume:0,audioCtx.currentTime,.08);if(musicOn)startMusic(moodNow);else clearInterval(musicTimer)}
function setMusicVolume(v){musicVolume=Number(v)/100;if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(musicOn?musicVolume:0,audioCtx.currentTime,.06)}
function setEffectVolume(v){effectVolume=Number(v)/100}
function effectTone(kind){if(!audioCtx||effectVolume<=0)return;let f=kind==='bright'?660:440,osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='triangle';osc.frequency.value=f;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.0002,.035*effectVolume),audioCtx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.24)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key===' '&&$('game').style.display!=='none'&&!$('panel').classList.contains('open')){e.preventDefault();advance()}});
</script>
</body>
